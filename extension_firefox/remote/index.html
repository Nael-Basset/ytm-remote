<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d11" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
  <title>YouTube Music Remote</title>
  <style>
    :root {
      color-scheme: dark;
      --fg-rgb: 255 255 255;
      --bg-rgb: 12 13 17;
      --shade-rgb: 0 0 0;
      --bg: rgb(var(--bg-rgb));
      --surface: #181a20;
      --card-bg: rgba(22, 24, 31, 0.72);
      --panel-bg: rgba(18, 20, 26, 0.8);
      --card-hover: rgb(var(--fg-rgb) / 0.08);
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.35);
      --text: rgb(var(--fg-rgb));
      --text-dim: rgb(var(--fg-rgb) / 0.65);
      --border: rgb(var(--fg-rgb) / 0.1);
      --cover-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
      --ambient-filter: blur(50px) saturate(2.4) brightness(0.5);
    }
    /* Thème clair : suit le réglage du téléphone */
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --fg-rgb: 22 24 30;
        --bg-rgb: 243 244 247;
        --shade-rgb: 255 255 255;
        --surface: #e4e6ec;
        --card-bg: rgba(255, 255, 255, 0.72);
        --panel-bg: rgba(255, 255, 255, 0.7);
        --text-dim: rgb(var(--fg-rgb) / 0.6);
        --border: rgb(var(--fg-rgb) / 0.12);
        --cover-shadow: 0 12px 30px rgba(20, 22, 30, 0.25);
        --ambient-filter: blur(50px) saturate(1.6) brightness(1.15);
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 14px calc(24px + env(safe-area-inset-bottom, 20px));
      overflow-x: hidden;
      overflow-y: auto;
    }
    /* Fond dynamique flouté */
    .ambient-bg {
      position: fixed;
      inset: -40px;
      background-size: cover;
      background-position: center;
      filter: var(--ambient-filter);
      opacity: 0.85;
      transform: scale(1.2);
      transition: background-image 0.5s ease;
      z-index: 0;
      pointer-events: none;
    }
    .ambient-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgb(var(--bg-rgb) / 0.3) 0%, rgb(var(--bg-rgb) / 0.92) 100%);
      z-index: 1;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Barre de statut P2P WebRTC */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: var(--text-dim);
      background: rgb(var(--shade-rgb) / 0.35);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
      backdrop-filter: blur(10px);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffaa00;
      box-shadow: 0 0 8px #ffaa00;
      transition: all 0.3s ease;
    }
    .status-dot.connected {
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }
    .status-dot.disconnected {
      background: #ff3344;
      box-shadow: 0 0 8px #ff3344;
    }
    /* Pochette */
    .cover-wrap {
      position: relative;
      width: min(65vw, 240px);
      height: min(65vw, 240px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--cover-shadow);
      background: var(--surface);
      margin: 6px 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    /* Pochette entière (les clips sont en 16:9) sur un fond flouté de la même image */
    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: -16px;
      background: var(--art, none) center / cover no-repeat;
      filter: blur(18px) brightness(0.7);
    }
    .cover-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .cover-img:not([src]), .cover-img[src=""] {
      visibility: hidden;
    }
    /* Métadonnées */
    .track-meta {
      width: 100%;
      text-align: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      padding: 0 4px;
    }
    .artist {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }
    /* Progression */
    .progress-box {
      width: 100%;
      margin-bottom: 12px;
    }
    .progress-slider {
      width: 100%;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    /* Commandes principales */
    .controls-main {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      margin-bottom: 14px;
    }
    .btn-nav {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }
    .btn-nav:active {
      transform: scale(0.9);
      background: rgb(var(--fg-rgb) / 0.1);
    }
    .btn-play {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn-play:active {
      transform: scale(0.92);
    }
    /* Commandes secondaires */
    .controls-sec {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 12px;
      padding: 0 10px;
    }
    .btn-tgl {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, transform 0.1s ease;
    }
    .btn-tgl:active {
      transform: scale(0.9);
    }
    .btn-tgl.active {
      color: var(--accent);
      background: rgba(255, 0, 85, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255, 0, 85, 0.35);
    }
    /* Barre Volume */
    .volume-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }
    .volume-slider {
      flex: 1;
      height: 4px;
      accent-color: var(--accent);
    }
    /* Bouton « volume à la main » (caméra) */
    .btn-hand {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-hand.loading { color: var(--text); animation: hand-pulse 1s ease-in-out infinite; }
    .btn-hand.tracking { color: #fff; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }
    .btn-hand.idle { color: var(--accent); background: rgba(255, 0, 85, 0.14); border-color: rgba(255, 0, 85, 0.4); }
    /* Curseur piloté à la main */
    .air-cursor {
      position: fixed;
      left: -16px;
      top: -16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: rgba(255, 0, 85, 0.25);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 1000;
      transition: width 0.1s ease, height 0.1s ease, left 0.1s ease, top 0.1s ease, background 0.1s ease;
    }
    .air-cursor.pressed {
      left: -11px;
      top: -11px;
      width: 22px;
      height: 22px;
      background: var(--accent);
    }
    .air-hover { outline: 2px solid var(--accent); outline-offset: 3px; }
    .air-pressed { transform: scale(0.94); }
    .btn-hand.error { color: #ff3344; border-color: rgba(255, 51, 68, 0.5); }
    @keyframes hand-pulse { 50% { opacity: 0.4; } }
    /* Glissement vertical sur la pochette : réglage du volume */
    .cover-wrap { touch-action: none; }
    /* L'image ne doit ni se « glisser-déposer » ni capter le doigt : le geste est sur le cadre */
    .cover-wrap .cover-img { pointer-events: none; -webkit-user-drag: none; }
    .cover-volume {
      position: absolute;
      inset: auto 12px 12px 12px;
      height: 6px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.45);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .cover-volume.visible { opacity: 1; }
    .cover-volume-fill { height: 100%; width: 0; background: #fff; }
    /* Aperçu caméra, uniquement avec ?debug */
    .hand-debug {
      position: fixed;
      left: 8px;
      bottom: 8px;
      width: 200px;
      height: 150px;
      border-radius: 8px;
      border: 1px solid var(--border);
      z-index: 50;
      transform: scaleX(-1);
    }
    /* Section Paroles */
    .lyrics-section {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(16px);
      margin-bottom: 16px;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }
    .lyrics-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .lyrics-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lyrics-title-text {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }
    .btn-fullscreen-lyrics {
      background: rgb(var(--fg-rgb) / 0.08);
      border: 1px solid rgb(var(--fg-rgb) / 0.12);
      color: var(--text);
      cursor: pointer;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-fullscreen-lyrics:active {
      transform: scale(0.92);
      background: rgb(var(--fg-rgb) / 0.2);
    }
    .lyrics-scroll {
      max-height: 360px;
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-right: 4px;
    }
    .lyrics-status {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      padding: 24px 10px;
      line-height: 1.5;
    }
    .lyrics-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 12px 0;
    }
    .lyric-line {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      opacity: 0.32;
      filter: blur(0.2px);
      transition: opacity 0.3s ease, filter 0.3s ease, background 0.25s ease;
    }
    .lyric-line:active {
      background: rgb(var(--fg-rgb) / 0.06);
    }
    .lyric-line.active {
      opacity: 1;
      filter: none;
      font-size: 18px;
      font-weight: 800;
      background: rgb(var(--fg-rgb) / 0.04);
    }
    .lyric-line.past-line {
      opacity: 0.55;
      filter: none;
    }
    .lyric-line.past-line .lyric-word {
      color: rgb(var(--fg-rgb) / 0.72);
      -webkit-text-fill-color: rgb(var(--fg-rgb) / 0.72);
    }

    /* Animation mot par mot au fur et à mesure de la prononciation (Style BetterLyrics sans grossissement) */
    .lyric-word {
      display: inline-block;
      white-space: pre;
      color: rgb(var(--fg-rgb) / 0.3);
      -webkit-text-fill-color: rgb(var(--fg-rgb) / 0.3);
      transition: color 0.12s ease, filter 0.18s ease;
    }
    .lyric-word.future {
      color: rgb(var(--fg-rgb) / 0.3);
      -webkit-text-fill-color: rgb(var(--fg-rgb) / 0.3);
      filter: none;
    }
    .lyric-word.singing {
      background: linear-gradient(90deg, rgb(var(--fg-rgb)) var(--prog, 0%), rgb(var(--fg-rgb) / 0.3) var(--prog, 0%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgb(var(--fg-rgb) / 0.75)) drop-shadow(0 0 20px rgb(var(--fg-rgb) / 0.3));
    }
    .lyric-word.past {
      background: none;
      -webkit-background-clip: initial;
      color: rgb(var(--fg-rgb));
      -webkit-text-fill-color: rgb(var(--fg-rgb));
      filter: drop-shadow(0 0 5px rgb(var(--fg-rgb) / 0.25));
    }
    /* Mode Plein Écran pour les paroles (Ancrage parfait sans glitch) */
    .lyrics-section.is-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 99999;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: none;
      border-radius: 0;
      border: none;
      background: rgb(var(--bg-rgb) / 0.98);
      backdrop-filter: blur(50px);
      margin: 0;
      padding: max(16px, env(safe-area-inset-top, 16px)) 16px 0;
      display: flex !important;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }
    .lyrics-section.is-fullscreen .lyrics-header {
      flex-shrink: 0;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .lyrics-section.is-fullscreen .lyrics-title-text {
      font-size: 15px;
    }
    .lyrics-section.is-fullscreen .btn-fullscreen-lyrics {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgb(var(--fg-rgb) / 0.16);
    }
    .lyrics-section.is-fullscreen .lyrics-scroll {
      max-height: none;
      flex: 1 1 0;
      min-height: 0; /* Empêche le contenu de pousser les boutons hors écran */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 4px 20px;
    }
    .lyrics-section.is-fullscreen .lyric-line {
      font-size: 24px;
      line-height: 1.45;
      padding: 10px 14px;
    }
    .lyrics-section.is-fullscreen .lyric-line.active {
      font-size: 24px;
      font-weight: 800;
      color: rgb(var(--fg-rgb));
      text-shadow: 0 0 20px rgb(var(--fg-rgb) / 0.6);
      background: rgb(var(--fg-rgb) / 0.06);
      border-radius: 12px;
    }
    .lyrics-fullscreen-controls {
      display: none;
    }
    .lyrics-section.is-fullscreen .lyrics-fullscreen-controls {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 12px 0 max(16px, env(safe-area-inset-bottom, 16px));
      border-top: 1px solid var(--border);
      background: rgb(var(--bg-rgb) / 0.85);
      backdrop-filter: blur(20px);
    }
    .btn-fs-nav {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .btn-fs-play {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    /* Section À Suivre (File d'attente / Queue) */
    .queue-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(16px);
      margin-bottom: 20px;
    }
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .queue-header-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .btn-queue-search {
      background: rgb(var(--fg-rgb) / 0.08);
      border: 1px solid rgb(var(--fg-rgb) / 0.12);
      color: var(--text);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
    }
    .btn-queue-search:hover, .btn-queue-search.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .btn-queue-search:active {
      transform: scale(0.92);
    }
    .search-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }
    .search-input-wrap {
      display: flex;
      align-items: center;
      background: rgb(var(--fg-rgb) / 0.06);
      border: 1px solid rgb(var(--fg-rgb) / 0.14);
      border-radius: 10px;
      padding: 8px 12px;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input-wrap:focus-within {
      border-color: var(--accent);
      background: rgb(var(--fg-rgb) / 0.1);
    }
    .search-icon {
      fill: var(--text-dim);
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
    }
    .search-input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
    }
    .search-clear-btn {
      background: rgb(var(--fg-rgb) / 0.1);
      border: none;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .search-clear-btn:hover {
      background: rgb(var(--fg-rgb) / 0.2);
    }
    .search-status {
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      padding: 6px;
    }
    .search-results-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .search-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgb(var(--fg-rgb) / 0.04);
      border: 1px solid rgb(var(--fg-rgb) / 0.06);
      transition: background 0.15s;
    }
    .search-item:hover {
      background: rgb(var(--fg-rgb) / 0.08);
    }
    .search-thumb {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #000;
    }
    .search-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .search-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-artist {
      font-size: 11.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .search-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-search-act {
      background: rgb(var(--fg-rgb) / 0.08);
      border: 1px solid rgb(var(--fg-rgb) / 0.12);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;

<body>

  <div class="content">

        </svg>

    <div class="volume-box">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.05A4.5 4.5 0 0016.5 12z"/></svg>

    <!-- Section Paroles -->
    <div class="lyrics-section" id="lyrics-box" style="display: none;">
      <div class="lyrics-header">

          <svg id="fullscreen-icon" viewBox="0 0 24 24" width="18" height="18">

          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="Chercher un titre à lancer ou ajouter…" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="search-clear-btn" id="search-clear" style="display: none;" title="Effacer">✕</button>

      <div class="queue-list" id="queue-list">

    <!-- Panneau Diagnostic / Logs -->
    <div class="logs-card" id="logs-card" hidden style="margin-top: 14px; background: rgb(var(--shade-rgb) / 0.5); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-family: monospace;">
      <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" id="logs-toggle">
        <span style="font-size: 11.5px; font-weight: 700; color: var(--text-dim); display: flex; align-items: center; gap: 6px;">
          📋 DIAGNOSTIC & LOGS
          <span id="logs-badge" style="font-size: 10px; background: rgba(255,255,255,0.1); padding: 1px 6px; border-radius: 8px;">0</span>
        </span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button id="btn-copy-logs" style="background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 10.5px; padding: 4px 8px; border-radius: 6px; cursor: pointer;">Copier</button>
          <button id="btn-clear-logs" style="background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 10.5px; padding: 4px 8px; border-radius: 6px; cursor: pointer;">Effacer</button>
          <span id="logs-arrow" style="font-size: 10px; color: var(--text-dim); transition: transform 0.2s;">▼</span>
        </div>
      </div>
      <div id="logs-body" style="display: none; margin-top: 10px; max-height: 250px; overflow-y: auto; font-size: 11px; line-height: 1.5; color: #bbb; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px;">
        <div id="logs-list" style="display: flex; flex-direction: column; gap: 4px;">
          <div style="color: #666;">Initialisation des logs…</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Les messages transitent en texte JSON brut sur le RTCDataChannel natif (le canal JSON de PeerJS
    // refuse tout message > 16 Ko). PeerJS écoute le même canal et appelle TextDecoder.decode() sur
    // ces chaînes : ce patch lui évite de lever une exception à chaque message.
    if (typeof TextDecoder !== 'undefined') {
      const origDecode = TextDecoder.prototype.decode;
      TextDecoder.prototype.decode = function (input, options) {
        if (typeof input === 'string') return input;
        if (!input) return '';
        return origDecode.call(this, input, options);
      };
    }

    let isUserSeeking = false;
    let isUserVolume = false;

    function vibrate() {
      if ('vibrate' in navigator) navigator.vibrate(15);
    }

    // URL https normalisée (guillemets percent-encodés) : sûre dans src= et dans url("…") CSS
    function safeHttpsUrl(u) {
      try {
        const url = new URL(String(u || ''));
        return url.protocol === 'https:' ? url.href.replace(/"/g, '%22') : '';
      } catch (e) {
        return '';
      }
    }

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    const PLAY_SVG = '<path d="M8 5v14l11-7z"/>';
    const PAUSE_SVG = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    const REPEAT_OFF_SVG = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
    const REPEAT_ALL_SVG = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/>';
    const REPEAT_ONE_SVG = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="12" y="15" text-anchor="middle" font-size="8.5" font-weight="900" font-family="sans-serif" fill="currentColor">1</text>';

    const el = {
      connDot: document.getElementById('conn-dot'),
      connText: document.getElementById('conn-text'),
      bg: document.getElementById('bg'),
      cover: document.getElementById('cover'),
      coverWrap: document.getElementById('cover-wrap'),
      title: document.getElementById('title'),
      artist: document.getElementById('artist'),
      seek: document.getElementById('seek'),
      curTime: document.getElementById('cur-time'),
      durTime: document.getElementById('dur-time'),
      play: document.getElementById('play'),
      playIcon: document.getElementById('play-icon'),
      prev: document.getElementById('prev'),
      next: document.getElementById('next'),
      like: document.getElementById('like'),
      dislike: document.getElementById('dislike'),
      shuffle: document.getElementById('shuffle'),
      repeat: document.getElementById('repeat'),
      repeatIcon: document.getElementById('repeat-icon'),
      lyricsBtn: document.getElementById('lyrics-btn'),
      lyricsBox: document.getElementById('lyrics-box'),
      lyricsScroll: document.getElementById('lyrics-scroll'),
      lyricsStatus: document.getElementById('lyrics-status'),
      lyricsList: document.getElementById('lyrics-list'),
      btnFs: document.getElementById('btn-lyrics-fullscreen'),
      fsIcon: document.getElementById('fullscreen-icon'),
      fsPlay: document.getElementById('fs-play'),
      fsPlayIcon: document.getElementById('fs-play-icon'),
      fsPrev: document.getElementById('fs-prev'),
      fsNext: document.getElementById('fs-next'),
      volume: document.getElementById('volume'),
      queueBox: document.getElementById('queue-box'),
      queueList: document.getElementById('queue-list'),
      queueCount: document.getElementById('queue-count'),
      btnSearchToggle: document.getElementById('btn-search-toggle'),
      searchPanel: document.getElementById('search-panel'),
      searchInput: document.getElementById('search-input'),
      searchClear: document.getElementById('search-clear'),
      searchStatus: document.getElementById('search-status'),
      searchResultsList: document.getElementById('search-results-list')
    };

    // ==========================================
    // Communication WebRTC P2P (Plug & Play universel)
    // ==========================================
    let peer = null;
    let dataChannel = null;
    const rawRoomId = (location.hash ? decodeURIComponent(location.hash.slice(1)) : new URLSearchParams(location.search).get('room') || '').trim();
    const targetRoomId = /^ytm-[a-z0-9-]{4,64}$/.test(rawRoomId) ? rawRoomId : '';

    // Identifiant secret et persistant de cet appareil : le PC s'en sert pour mémoriser
    // les appareils déjà autorisés.
    function getDeviceId() {
      try {
        let id = localStorage.getItem('ytmr_device_id');
        if (!id || !/^[a-f0-9]{32}$/.test(id)) {
          const bytes = crypto.getRandomValues(new Uint8Array(16));
          id = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
          localStorage.setItem('ytmr_device_id', id);
        }
        return id;
      } catch (e) {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      }
    }
    const deviceId = getDeviceId();
    function getDeviceName() {
      const ua = navigator.userAgent || '';
      if (/iPhone/i.test(ua)) return 'iPhone';
      if (/iPad/i.test(ua)) return 'iPad';
      if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? 'Téléphone Android' : 'Tablette Android';
      if (/Mac OS X/i.test(ua)) return 'Mac';
      if (/Windows/i.test(ua)) return 'PC Windows';
      return 'Navigateur';
    }
    // 'pending' | 'approved' | 'denied' | 'revoked'
    let authStatus = 'pending';

    // ==========================================
    // Système de Logs & Diagnostic en temps réel
    // ==========================================
    // Panneau de diagnostic réservé au débogage : ajouter ?debug à l'URL pour l'afficher
    if (new URLSearchParams(location.search).has('debug')) {
      document.getElementById('logs-card').hidden = false;
    }
    const logsListEl = document.getElementById('logs-list');
    const logsBadgeEl = document.getElementById('logs-badge');
    const logsBodyEl = document.getElementById('logs-body');
    const logsArrowEl = document.getElementById('logs-arrow');
    const logsToggleEl = document.getElementById('logs-toggle');
    const btnCopyLogs = document.getElementById('btn-copy-logs');
    const btnClearLogs = document.getElementById('btn-clear-logs');
    let logsCount = 0;
    let isLogsOpen = false;
    const allLogEntries = [];

    function addLog(tag, msg, color = '#aaa') {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const entryText = `[${timeStr}] [${tag}] ${msg}`;
      allLogEntries.push(entryText);
      if (allLogEntries.length > 250) allLogEntries.shift();

      logsCount++;
      if (logsBadgeEl) logsBadgeEl.textContent = logsCount;

      if (logsListEl) {
        if (logsCount === 1) logsListEl.innerHTML = '';
        const row = document.createElement('div');
        row.style.cssText = `color: ${color}; word-break: break-all; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 2px;`;
        // Le message peut contenir des titres ou des données reçues du réseau : jamais d'innerHTML.
        const timeEl = document.createElement('span');
        timeEl.style.opacity = '0.5';
        timeEl.textContent = `[${timeStr}]`;
        const tagEl = document.createElement('strong');
        tagEl.style.color = color;
        tagEl.textContent = `[${tag}]`;
        row.append(timeEl, ' ', tagEl, ' ', String(msg));
        logsListEl.appendChild(row);
        if (isLogsOpen) {
          logsBodyEl.scrollTop = logsBodyEl.scrollHeight;
        }
      }
    }

    if (logsToggleEl) {
      logsToggleEl.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        isLogsOpen = !isLogsOpen;
        logsBodyEl.style.display = isLogsOpen ? 'block' : 'none';
        logsArrowEl.style.transform = isLogsOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        if (isLogsOpen) logsBodyEl.scrollTop = logsBodyEl.scrollHeight;
      });
    }

    if (btnCopyLogs) {
      btnCopyLogs.addEventListener('click', (e) => {
        e.stopPropagation();
        const text = allLogEntries.join('\n');
        navigator.clipboard.writeText(text).then(() => {
          const old = btnCopyLogs.textContent;
          btnCopyLogs.textContent = 'Copié !';
          setTimeout(() => { btnCopyLogs.textContent = old; }, 1500);
        }).catch(() => {
          alert('Impossible de copier automatiquement. Sélectionnez le texte ci-dessous.');
        });
      });
    }

    if (btnClearLogs) {
      btnClearLogs.addEventListener('click', (e) => {
        e.stopPropagation();
        allLogEntries.length = 0;
        logsCount = 0;
        if (logsBadgeEl) logsBadgeEl.textContent = '0';
        if (logsListEl) logsListEl.innerHTML = '<div style="color: #666;">Logs effacés.</div>';
      });
    }

    addLog('INIT', 'Démarrage télécommande. Room cible: ' + (targetRoomId || 'AUCUNE (flashez le QR)'), '#fff');

    // Envoi unique en texte JSON sur le RTCDataChannel natif (voir le commentaire du patch TextDecoder)
    function sendRaw(payload) {
      const dc = dataChannel && dataChannel.dataChannel;
      if (!payload || !dc || dc.readyState !== 'open') return false;
      try {
        dc.send(JSON.stringify(payload));
        return true;
      } catch (e) {
        return false;
      }
    }

    function sendP2PMessage(payload) {
      if (authStatus !== 'approved') return false;
      return sendRaw(payload);
    }

    function sendAction(action, value = null) {
      vibrate();
      if (authStatus !== 'approved') {
        addLog('ERR', 'Action ignorée (' + action + ') : appareil pas encore autorisé par le PC', '#ff3366');
        return;
      }
      const valStr = (value !== null && value !== undefined) ? ' ' + JSON.stringify(value) : '';
      const msgId = 'act-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
      const payload = { action, value, msgId };

      const sent = sendP2PMessage(payload);
      if (sent) {
        addLog('ENVOI', action + valStr, '#00e5ff');
      } else {
        addLog('ERR', 'Échec envoi (' + action + '): Canal non ouvert !', '#ff3366');
      }
    }

    function initWebRTCClient() {
      if (!targetRoomId) {
        el.connDot.className = 'status-dot disconnected';
        el.connText.textContent = 'Lien incomplet : flashez le QR Code';
        addLog('ERR', 'Room ID absent de l\'URL (#ytm-...)', '#ff3366');
        return;
      }

      el.connDot.className = 'status-dot';
      el.connText.textContent = 'Connexion à votre PC…';
      addLog('CONN', 'Initialisation PeerJS client…', '#ffbb00');

      try {
        peer = new Peer({ debug: 1 });

        peer.on('open', (id) => {
          addLog('CONN', 'Peer client prêt (id=' + id + '). Connexion à l\'hôte: ' + targetRoomId, '#00e676');
          connectToPeerHost();
        });

        peer.on('error', (err) => {
          console.warn('Peer error:', err);
          el.connDot.className = 'status-dot disconnected';
          el.connText.textContent = 'Erreur réseau : reconnexion…';
          addLog('ERR', 'Erreur PeerJS: ' + (err?.type || err?.message || err), '#ff3366');
          if (authStatus === 'denied' || authStatus === 'revoked') return;
          if (peer.disconnected && !peer.destroyed) {
            addLog('CONN', 'Reconnexion au serveur de signalisation…', '#ffbb00');
            peer.reconnect();
          } else if (peer.destroyed) {
            initWebRTCClient();
          } else {
            setTimeout(connectToPeerHost, 3000);
          }
        });

        peer.on('disconnected', () => {
          addLog('CONN', 'Peer déconnecté du serveur de signalisation. Reconnexion…', '#ffbb00');
          if (!peer.destroyed) {
            peer.reconnect();
          }
        });
      } catch (e) {
        console.error('PeerJS init failed:', e);
        addLog('ERR', 'Exception PeerJS: ' + e.message, '#ff3366');
      }
    }

    function setAuthStatus(status) {
      authStatus = status;
      if (status === 'approved') {
        // Recharger les paroles du morceau en cours dès l'autorisation
        if (typeof lastLyricsTrackKey !== 'undefined') lastLyricsTrackKey = '';
        el.connDot.className = 'status-dot connected';
        el.connText.textContent = 'Connecté en direct à votre PC';
        addLog('AUTH', 'Appareil autorisé par le PC', '#00e676');
      } else if (status === 'pending') {
        el.connDot.className = 'status-dot';
        el.connText.textContent = 'Acceptez la connexion sur votre PC…';
        addLog('AUTH', 'En attente d\'autorisation sur le PC', '#ffbb00');
      } else if (status === 'denied') {
        el.connDot.className = 'status-dot disconnected';
        el.connText.textContent = 'Accès refusé par le PC. Rechargez pour réessayer.';
        addLog('AUTH', 'Accès refusé par le PC', '#ff3366');
      } else if (status === 'revoked') {
        el.connDot.className = 'status-dot disconnected';
        el.connText.textContent = 'Déconnecté par le PC. Rechargez pour réessayer.';
        addLog('AUTH', 'Appareil déconnecté par le PC', '#ff3366');
      }
    }

    function connectToPeerHost() {
      if (!peer || peer.destroyed) return;
      if (authStatus === 'denied' || authStatus === 'revoked') return;
      if (peer.disconnected) {
        peer.reconnect();
        return;
      }
      addLog('CONN', 'Tentative de connexion à ' + targetRoomId + '…', '#ffbb00');
      authStatus = 'pending';
      dataChannel = peer.connect(targetRoomId, {
        reliable: true,
        serialization: 'json'
      });

      let lastLoggedTrack = '';
      let lastLoggedPlay = null;

      function handleIncomingData(raw) {
        if (!raw) return;
        let payload = raw;
        if (typeof payload === 'string') {
          try { payload = JSON.parse(payload); } catch (e) {}
        }
        if (typeof payload !== 'object' || !payload) return;

        if (payload.type === 'auth') {
          if (['pending', 'approved', 'denied', 'revoked'].includes(payload.status)) {
            setAuthStatus(payload.status);
          }
          return;
        }
        if (authStatus !== 'approved') return;

        if (payload.type === 'diag-log') {
          addLog('PC', payload.message, '#a8ff00');
        } else if (payload.type === 'state') {
          const s = payload.data || {};
          const trackKey = (s.title || '') + '|' + (s.artist || '');
          if (trackKey !== lastLoggedTrack || s.isPlaying !== lastLoggedPlay) {
            lastLoggedTrack = trackKey;
            lastLoggedPlay = s.isPlaying;
            addLog('REÇU', `State: [${s.isPlaying ? '▶ EN LECTURE' : '⏸ EN PAUSE'}] "${s.title}" (${s.artist})`, '#b388ff');
          }
          applyState(payload.data);
        } else if (payload.type === 'lyrics') {
          applyLyricsResponse(payload);
        } else if (payload.type === 'search-results') {
          addLog('REÇU', `Recherche: ${payload.results?.length || 0} résultats pour "${payload.query}"`, '#00e5ff');
          renderSearchResults(payload.results, payload.query);
        }
      }

      function bindNativeClientChannel(dc) {
        if (!dc || dc._ytmBound) return;
        dc._ytmBound = true;
        try { dc.binaryType = 'arraybuffer'; } catch (e) {}

        dc.addEventListener('message', async (evt) => {
          let data = evt.data;
          if (data instanceof Blob) {
            try { data = await data.text(); } catch (e) {}
          } else if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) {
            try { data = new TextDecoder().decode(data); } catch (e) {}
          }
          handleIncomingData(data);
        });
      }

      // Les messages n'arrivent que par le canal natif : pas de handler dataChannel.on('data'),
      // sinon chaque message serait traité deux fois.
      dataChannel.on('open', () => {
        addLog('CONN', 'Canal WebRTC ouvert. Demande d\'autorisation au PC…', '#00e676');
        if (dataChannel.dataChannel) bindNativeClientChannel(dataChannel.dataChannel);
        setAuthStatus('pending');
        sendRaw({ type: 'hello', deviceId, deviceName: getDeviceName() });
      });

      dataChannel.on('close', () => {
        if (authStatus === 'denied' || authStatus === 'revoked') return;
        el.connDot.className = 'status-dot disconnected';
        el.connText.textContent = 'Déconnecté du PC. Reconnexion…';
        addLog('CONN', 'Canal fermé. Reconnexion dans 2.5s…', '#ff9100');
        authStatus = 'pending';
        setTimeout(connectToPeerHost, 2500);
      });
    }

    initWebRTCClient();

    // ==========================================
    // Gestion de la Recherche YouTube Music
    // ==========================================
    let isSearchOpen = false;
    let searchDebounceTimer = null;
    let currentSearchReqId = '';

    function toggleSearchPanel() {

        // Bouton 2 : Ajouter à la file d'attente

        btnQueue.addEventListener('click', (e) => {
          e.stopPropagation();

          const trackPayload = {

          btnQueue.title = 'Ajouté à la file d\'attente !';
          setTimeout(() => {
            btnQueue.classList.remove('added');
            btnQueue.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>';
            btnQueue.title = 'Ajouter à la file d\'attente';
          }, 2000);

          // Ajout immédiat dans l'affichage local de la queue juste après le titre en cours
          let curIdx = currentQueue.findIndex(it => it.isCurrent);
          const insertIdx = (curIdx !== -1) ? curIdx + 1 : currentQueue.length;
          currentQueue.splice(insertIdx, 0, {
            index: insertIdx,
            title: item.title,

          currentQueue.forEach((it, i) => { it.index = i; });
          renderQueue(currentQueue);

        actions.appendChild(btnPlay);
        actions.appendChild(btnQueue);
        row.appendChild(actions);

        el.searchResultsList.appendChild(row);

    // ==========================================
    // Contrôles du Lecteur
    // ==========================================
    el.play.addEventListener('click', () => sendAction('play-pause'));
    el.prev.addEventListener('click', () => sendAction('prev'));
    el.next.addEventListener('click', () => sendAction('next'));
    el.like.addEventListener('click', () => sendAction('like'));
    el.dislike.addEventListener('click', () => sendAction('dislike'));
    el.shuffle.addEventListener('click', () => sendAction('toggle-shuffle'));

    let currentRepeatMode = 0;
    function renderRepeatBtn(mode) {
      currentRepeatMode = mode;
      if (mode === 2) {
        el.repeatIcon.innerHTML = REPEAT_ONE_SVG;
        el.repeat.className = 'btn-tgl active';

    if (el.fsPlay) el.fsPlay.addEventListener('click', () => sendAction('play-pause'));
    if (el.fsPrev) el.fsPrev.addEventListener('click', () => sendAction('prev'));
    if (el.fsNext) el.fsNext.addEventListener('click', () => sendAction('next'));

    // ==========================================
    // Gestion des Paroles et Plein Écran
    // ==========================================
    let lyricsOpen = false;
    let isFullscreenLyrics = false;
    let lyricsLines = [];
    let lastLyricsTrackKey = '';
    let currentActiveLyricIndex = -1;
    let lastTrackDuration = 0;

    if (el.lyricsBtn) {
      el.lyricsBtn.addEventListener('click', () => {
        vibrate();
        lyricsOpen = !lyricsOpen;
        el.lyricsBtn.classList.toggle('active', lyricsOpen);
        el.lyricsBox.style.display = lyricsOpen ? 'block' : 'none';
        if (lyricsOpen) {
          if (lyricsLines.length === 0) {
            fetchLyrics(el.title.textContent, el.artist.textContent, lastTrackDuration);
          }
          el.lyricsBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });

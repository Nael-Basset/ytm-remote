<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme: light)">
  <title>YouTube Music Remote</title>
  <style>
    /* Télécommande. Direction : posée, tactile, à portée de pouce. Un salon le soir, une chaîne
       hi-fi : commandes sobres, la pochette seule source de couleur, le voyant de l'appareil piloté
       comme signature. Grille de 4 px ; tailles 11 / 13 / 17 / 22 ; graisses 400 à 600.
       Mise en page : le lecteur tient sur un écran ; barre d'outils translucide en bas ; paroles et
       file d'attente dans des panneaux qu'on tire du bas. */
    :root {
      color-scheme: dark;
      --fg-rgb: 245 245 247;
      --bg-rgb: 13 13 16;
      --shade-rgb: 0 0 0;
      --bg: rgb(var(--bg-rgb));
      --surface: #1b1b20;
      --text: rgb(var(--fg-rgb));
      --text-dim: rgb(var(--fg-rgb) / 0.62);
      --text-muted: rgb(var(--fg-rgb) / 0.38);
      --track: rgb(var(--fg-rgb) / 0.16);
      --fill: rgb(var(--fg-rgb) / 0.86);
      --border: rgb(var(--fg-rgb) / 0.08);
      --card-hover: rgb(var(--fg-rgb) / 0.08);
      --accent: #ff2d6a;
      --accent-soft: rgba(255, 45, 106, 0.14);
      --ok: #30d158;
      --wait: #d9a441;
      --bad: #e5544b;
      --material: rgba(30, 30, 36, 0.66);
      --material-edge: rgba(255, 255, 255, 0.08);
      --scrim: rgba(0, 0, 0, 0.5);
      --cover-shadow: 0 16px 44px rgba(0, 0, 0, 0.55);
      --ambient-opacity: 0.35;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --fg-rgb: 18 18 22;
        --bg-rgb: 242 242 245;
        --shade-rgb: 255 255 255;
        --surface: #ffffff;
        --text-dim: rgb(var(--fg-rgb) / 0.62);
        --text-muted: rgb(var(--fg-rgb) / 0.4);
        --track: rgb(var(--fg-rgb) / 0.14);
        --fill: rgb(var(--fg-rgb) / 0.78);
        --border: rgb(var(--fg-rgb) / 0.08);
        --accent: #d6004a;
        --accent-soft: rgba(214, 0, 74, 0.1);
        --ok: #1f9d50;
        --wait: #a8741a;
        --bad: #c4372e;
        --material: rgba(246, 246, 249, 0.72);
        --material-edge: rgba(255, 255, 255, 0.7);
        --scrim: rgba(0, 0, 0, 0.28);
        --cover-shadow: 0 16px 40px rgba(20, 20, 30, 0.22);
        --ambient-opacity: 0.3;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 100%/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
    svg { display: block; fill: currentColor; }

    /* Fond : la pochette très floutée teinte la pièce sans distraire */
    .ambient-bg {
      position: fixed;
      inset: -20%;
      background-size: cover;
      background-position: center;
      filter: blur(60px) saturate(1.4);
      opacity: var(--ambient-opacity);
      z-index: 0;
      pointer-events: none;
      transition: background-image 0.5s var(--ease);
    }
    .ambient-overlay { display: none; }

    /* Lecteur : une colonne qui tient sur un écran */
    .player {
      position: relative;
      z-index: 1;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: calc(env(safe-area-inset-top, 0px) + 8px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 84px) max(20px, env(safe-area-inset-left, 0px));
    }

    /* En-tête : l'appareil piloté et son voyant (signature), outil caméra à droite */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    .device { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 0.8125rem; font-weight: 500; color: var(--text-dim); }
    .device span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); flex: none; transition: background-color 0.3s var(--ease); }
    .status-dot.connected { background: var(--ok); }
    .status-dot.disconnected { background: var(--bad); }

    .btn-icon, .btn-hand {
      width: 44px;
      height: 44px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      color: var(--text-dim);
      flex: none;
      transition: color 0.15s var(--ease), background-color 0.15s var(--ease);
    }
    .btn-icon svg, .btn-hand svg { width: 24px; height: 24px; }
    .btn-icon:active, .btn-hand:active { background: var(--track); }
    .btn-icon.active { color: var(--accent); }
    .btn-hand.loading { color: var(--text); animation: hand-wait 1.2s ease-in-out infinite; }
    .btn-hand.tracking { color: var(--accent); background: var(--accent-soft); }
    .btn-hand.idle { color: var(--accent); }
    .btn-hand.error { color: var(--bad); }
    @keyframes hand-wait { 50% { opacity: 0.45; } }

    /* Pochette : entière sur un fond flouté d'elle-même ; glisser verticalement règle le volume */
    .cover-area { flex: 1; min-height: 0; display: grid; place-items: center; }
    .cover-wrap {
      position: relative;
      width: min(100%, 46vh, 340px);
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--cover-shadow);
      touch-action: none;
    }
    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: -16px;
      background: var(--art, none) center / cover no-repeat;
      filter: blur(18px) brightness(0.7);
    }
    .cover-img { position: relative; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
    .cover-img:not([src]), .cover-img[src=""] { visibility: hidden; }
    .cover-volume {
      position: absolute;
      inset: auto 12px 12px 12px;
      height: 4px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.45);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s var(--ease);
      pointer-events: none;
    }
    .cover-volume.visible { opacity: 1; }
    .cover-volume-fill { height: 100%; width: 0; background: #fff; }

    /* Titre et avis */
    .meta { display: flex; align-items: center; gap: 4px; }
    .meta-text { flex: 1; min-width: 0; }
    .title { font-size: 1.375rem; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { font-size: 1.0625rem; color: var(--text-dim); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Curseurs : piste fine au repos, épaisse sous le doigt ; remplissage piloté par --p */
    .range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 32px;
      background: transparent;
      cursor: pointer;
      touch-action: none;
      --p: 0%;
      --h: 4px;
    }
    .range.is-active { --h: 12px; }
    .range::-webkit-slider-runnable-track {
      height: var(--h);
      border-radius: calc(var(--h) / 2);
      background: linear-gradient(to right, var(--fill) var(--p), var(--track) var(--p));
      transition: height 0.16s var(--ease);
    }
    .range::-webkit-slider-thumb { -webkit-appearance: none; width: 1px; height: var(--h); opacity: 0; }
    .range::-moz-range-track { height: var(--h); border-radius: calc(var(--h) / 2); background: var(--track); }
    .range::-moz-range-progress { height: var(--h); border-radius: calc(var(--h) / 2); background: var(--fill); }
    .range::-moz-range-thumb { width: 1px; height: var(--h); border: 0; opacity: 0; }
    .times { display: flex; justify-content: space-between; margin-top: -4px; font-size: 0.8125rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    /* Transport : gros glyphes, sans halo, retour immédiat à l'appui */
    .transport { display: flex; align-items: center; justify-content: space-evenly; }
    .btn-nav, .btn-play {
      width: 72px;
      height: 72px;
      border-radius: 36px;
      display: grid;
      place-items: center;
      transition: transform 0.1s var(--ease), background-color 0.1s var(--ease);
    }
    .btn-nav:active, .btn-play:active { transform: scale(0.9); background: var(--track); }
    .btn-nav svg { width: 36px; height: 36px; }
    .btn-play svg { width: 52px; height: 52px; }

    /* Volume : bornes explicites */
    .volume-box { display: flex; align-items: center; gap: 12px; color: var(--text-muted); }
    .volume-box svg { width: 18px; height: 18px; flex: none; }

    /* Barre d'outils translucide : la seule couche de verre de l'écran */
    .toolbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      display: flex;
      justify-content: space-around;
      padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(12px, env(safe-area-inset-left, 0px));
      background: var(--material);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid var(--material-edge);
    }
    .tool {
      min-width: 64px;
      height: 56px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      border-radius: 12px;
      color: var(--text-dim);
      font-size: 0.6875rem;
      font-weight: 500;
      transition: color 0.15s var(--ease), background-color 0.15s var(--ease);
    }
    .tool svg { width: 24px; height: 24px; }
    .tool.active { color: var(--accent); }
    .tool:active { background: var(--track); }

    /* Panneaux tirables (paroles, file d'attente) */
    .sheet-scrim { position: fixed; inset: 0; z-index: 6; background: var(--scrim); opacity: 0; pointer-events: none; }
    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      height: 100%;
      z-index: 7;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.25);
      transform: translateY(110%);
      will-change: transform;
    }
    .sheet-head { flex: none; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px)); touch-action: none; cursor: grab; }
    .grabber { width: 36px; height: 4px; border-radius: 2px; background: var(--text-muted); margin: 0 auto 12px; }
    .sheet-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
    .sheet-title h2 { font-size: 1.0625rem; font-weight: 600; }
    .sheet-actions { display: flex; align-items: center; gap: 4px; }
    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(12px, env(safe-area-inset-left, 0px));
    }
    .queue-count { font-size: 0.8125rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .queue-count::after { content: " titres"; }

    /* Paroles */
    .lyrics-scroll { scroll-behavior: smooth; }
    .lyrics-status { font-size: 0.8125rem; color: var(--text-dim); text-align: center; padding: 24px 12px; line-height: 1.5; }
    .lyrics-list { display: flex; flex-direction: column; gap: 4px; padding: 4px 0 24px; min-width: 0; }
    .lyric-line {
      font-size: 1.375rem;
      font-weight: 600;
      line-height: 1.35;
      padding: 8px 8px;
      border-radius: 12px;
      cursor: pointer;
      opacity: 0.4;
      min-width: 0;           /* les lignes longues passent à la ligne dans la largeur du panneau */
      overflow-wrap: anywhere;
      transition: opacity 0.3s var(--ease), background-color 0.25s var(--ease);
    }
    .lyric-line:active { background: var(--card-hover); }
    .lyric-line.active { opacity: 1; }
    .lyric-line.past-line { opacity: 0.55; }
    .lyric-line.past-line .lyric-word { color: rgb(var(--fg-rgb) / 0.72); -webkit-text-fill-color: rgb(var(--fg-rgb) / 0.72); }
    /* Mot par mot : le mot chanté se remplit de gauche à droite (--prog), sans halo */
    .lyric-word { display: inline-block; white-space: pre; color: rgb(var(--fg-rgb) / 0.3); -webkit-text-fill-color: rgb(var(--fg-rgb) / 0.3); transition: color 0.12s var(--ease); }
    .lyric-word.future { color: rgb(var(--fg-rgb) / 0.3); -webkit-text-fill-color: rgb(var(--fg-rgb) / 0.3); }
    .lyric-word.singing {
      background: linear-gradient(90deg, rgb(var(--fg-rgb)) var(--prog, 0%), rgb(var(--fg-rgb) / 0.3) var(--prog, 0%));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .lyric-word.past { background: none; color: rgb(var(--fg-rgb)); -webkit-text-fill-color: rgb(var(--fg-rgb)); }
    /* « Plein écran » : le panneau occupe tout l'écran, texte plus grand, mini transport en bas */
    .sheet.is-fullscreen { transform: none !important; border-radius: 0; z-index: 9; }
    .sheet.is-fullscreen .lyric-line { font-size: 1.75rem; padding: 8px 12px; }
    .lyrics-fullscreen-controls { display: none; }
    .sheet.is-fullscreen .lyrics-fullscreen-controls {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 8px 0 calc(env(safe-area-inset-bottom, 0px) + 12px);
      border-top: 1px solid var(--border);
    }
    .btn-fs-nav, .btn-fs-play { width: 56px; height: 56px; border-radius: 28px; display: grid; place-items: center; }
    .btn-fs-nav svg { width: 28px; height: 28px; }
    .btn-fs-play svg { width: 36px; height: 36px; }
    .btn-fs-nav:active, .btn-fs-play:active { background: var(--track); }

    /* Recherche */
    .search-panel { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
    .search-input-wrap { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--track); transition: box-shadow 0.15s var(--ease); }
    .search-input-wrap:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
    .search-icon { width: 18px; height: 18px; flex: none; color: var(--text-muted); }
    .search-input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font: 400 1.0625rem/1.2 inherit; user-select: text; }
    .search-input::placeholder { color: var(--text-muted); }
    .search-clear-btn { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; background: var(--track); color: var(--text-dim); font-size: 0.6875rem; }
    .search-status { font-size: 0.8125rem; color: var(--text-dim); text-align: center; padding: 8px; }
    .search-results-list { display: flex; flex-direction: column; gap: 4px; }
    .search-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; transition: background-color 0.15s var(--ease); }
    .search-item:active { background: var(--card-hover); }
    .search-thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: var(--track); }
    .search-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .search-title { font-size: 1.0625rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-artist { font-size: 0.8125rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-actions { display: flex; align-items: center; gap: 4px; flex: none; }
    .btn-search-act { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--text-dim); transition: color 0.15s var(--ease), background-color 0.15s var(--ease); }
    .btn-search-act:active { background: var(--track); }
    .btn-search-act.added { color: var(--ok); }

    /* File d'attente */
    .queue-list { display: flex; flex-direction: column; gap: 4px; }
    .queue-item { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px; border-radius: 10px; cursor: pointer; transition: background-color 0.15s var(--ease); }
    .queue-item:active { background: var(--card-hover); }
    .queue-thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: var(--track); }
    .queue-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .queue-title { font-size: 1.0625rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-item.current .queue-title { color: var(--accent); font-weight: 500; }
    .queue-artist { font-size: 0.8125rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-duration { font-size: 0.8125rem; color: var(--text-muted); font-variant-numeric: tabular-nums; flex: none; }

    /* Curseur piloté à la main */
    .air-cursor {
      position: fixed;
      left: -16px;
      top: -16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 4px 12px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 1000;
      transition: width 0.1s var(--ease), height 0.1s var(--ease), left 0.1s var(--ease), top 0.1s var(--ease), background-color 0.1s var(--ease);
    }
    .air-cursor.pressed { left: -12px; top: -12px; width: 24px; height: 24px; background: var(--accent); }
    .air-hover { outline: 2px solid var(--accent); outline-offset: 2px; }
    .air-pressed { transform: scale(0.94); }
    /* Aperçu caméra, uniquement avec ?debug */
    .hand-debug { position: fixed; left: 8px; bottom: 96px; width: 200px; height: 152px; border-radius: 8px; border: 1px solid var(--border); z-index: 50; transform: scaleX(-1); }
    .logs-card { margin: 12px 8px 0; }

    @media (prefers-reduced-motion: reduce) {
      .range::-webkit-slider-runnable-track, .btn-nav, .btn-play, .lyric-line { transition: none; }
      .btn-hand.loading { animation: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .toolbar { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .ambient-bg { display: none; }
    }
  </style>
  <script src="peerjs.min.js"></script>
</head>
<body>
  <div class="ambient-bg" id="bg"></div>
  <div class="ambient-overlay"></div>

  <main class="player">
    <header class="top">
      <div class="device"><div class="status-dot" id="conn-dot"></div><span id="conn-text">Connexion à votre PC…</span></div>
      <button class="btn-hand" id="hand-btn" title="Curseur à la main (caméra) : paume pour viser, pincement pour cliquer" aria-label="Curseur à la main">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 7a1.5 1.5 0 0 0-3 0v4.5h-.5V3.5a1.5 1.5 0 0 0-3 0v8h-.5V2.5a1.5 1.5 0 0 0-3 0v9H10.5V5a1.5 1.5 0 0 0-3 0v10.2l-2.4-2.3a1.6 1.6 0 0 0-2.3 2.2l4.6 5.4A5 5 0 0 0 11.2 22H16a5 5 0 0 0 5-5z"/></svg>
      </button>
    </header>

    <div class="cover-area">
      <div class="cover-wrap" id="cover-wrap">
        <img id="cover" class="cover-img" src="" alt="Pochette" draggable="false">
        <div class="cover-volume" id="cover-volume"><div class="cover-volume-fill" id="cover-volume-fill"></div></div>
      </div>
    </div>

    <section class="meta">
      <div class="meta-text">
        <div class="title" id="title">En attente de connexion…</div>
        <div class="artist" id="artist">Scannez le QR Code sur YouTube Music</div>
      </div>
      <button class="btn-icon" id="dislike" title="Je n'aime pas" aria-label="Je n'aime pas">
        <svg viewBox="0 0 24 24"><path d="M15 3H6a2 2 0 0 0-1.8 1.2l-3 7a2 2 0 0 0-.2.8v2a2 2 0 0 0 2 2h6.3l-1 4.6V21a1.5 1.5 0 0 0 .5 1l1 1 6.6-6.6A2 2 0 0 0 17 15V5a2 2 0 0 0-2-2zm4 0h4v12h-4z"/></svg>
      </button>
      <button class="btn-icon" id="like" title="J'aime" aria-label="J'aime">
        <svg viewBox="0 0 24 24"><path d="M9 21h9a2 2 0 0 0 1.8-1.2l3-7a2 2 0 0 0 .2-.8v-2a2 2 0 0 0-2-2h-6.3l1-4.6V3a1.5 1.5 0 0 0-.5-1L14.2 1 7.6 7.6A2 2 0 0 0 7 9v10a2 2 0 0 0 2 2zM1 9h4v12H1z"/></svg>
      </button>
    </section>

    <section>
      <input type="range" class="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
      <div class="times"><span id="cur-time">0:00</span><span id="dur-time">0:00</span></div>
    </section>

    <section class="transport">
      <button class="btn-nav" id="prev" title="Précédent" aria-label="Précédent">

      <!-- Diagnostic (visible avec ?debug) -->

          <div id="logs-list" style="display: flex; flex-direction: column; gap: 4px;">
            <div style="color: var(--text-muted);">Initialisation des journaux…</div>
          </div>

  <script>
    // Les messages transitent en texte JSON brut sur le RTCDataChannel natif (le canal JSON de PeerJS
    // refuse tout message > 16 Ko). PeerJS écoute le même canal et appelle TextDecoder.decode() sur
    // ces chaînes : ce patch lui évite de lever une exception à chaque message.
    if (typeof TextDecoder !== 'undefined') {
      const origDecode = TextDecoder.prototype.decode;
      TextDecoder.prototype.decode = function (input, options) {
        if (typeof input === 'string') return input;
        if (!input) return '';
        return origDecode.call(this, input, options);
      };
    }

    let isUserSeeking = false;
    let isUserVolume = false;

    function vibrate() {
      if ('vibrate' in navigator) navigator.vibrate(15);
    }

    // URL https normalisée (guillemets percent-encodés) : sûre dans src= et dans url("…") CSS
    function safeHttpsUrl(u) {
      try {
        const url = new URL(String(u || ''));
        return url.protocol === 'https:' ? url.href.replace(/"/g, '%22') : '';
      } catch (e) {
        return '';
      }
    }

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    const PLAY_SVG = '<path d="M8 5v14l11-7z"/>';
    const PAUSE_SVG = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    const REPEAT_OFF_SVG = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
    const REPEAT_ALL_SVG = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/>';
    const REPEAT_ONE_SVG = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="12" y="15" text-anchor="middle" font-size="8.5" font-weight="900" font-family="sans-serif" fill="currentColor">1</text>';

    const el = {
      connDot: document.getElementById('conn-dot'),
      connText: document.getElementById('conn-text'),
      bg: document.getElementById('bg'),
      cover: document.getElementById('cover'),
      coverWrap: document.getElementById('cover-wrap'),
      title: document.getElementById('title'),
      artist: document.getElementById('artist'),
      seek: document.getElementById('seek'),
      curTime: document.getElementById('cur-time'),
      durTime: document.getElementById('dur-time'),
      play: document.getElementById('play'),
      playIcon: document.getElementById('play-icon'),
      prev: document.getElementById('prev'),
      next: document.getElementById('next'),
      like: document.getElementById('like'),
      dislike: document.getElementById('dislike'),
      shuffle: document.getElementById('shuffle'),
      repeat: document.getElementById('repeat'),
      repeatIcon: document.getElementById('repeat-icon'),
      lyricsBtn: document.getElementById('lyrics-btn'),
      lyricsBox: document.getElementById('lyrics-box'),
      lyricsScroll: document.getElementById('lyrics-scroll'),
      lyricsStatus: document.getElementById('lyrics-status'),
      lyricsList: document.getElementById('lyrics-list'),
      btnFs: document.getElementById('btn-lyrics-fullscreen'),
      fsIcon: document.getElementById('fullscreen-icon'),
      fsPlay: document.getElementById('fs-play'),
      fsPlayIcon: document.getElementById('fs-play-icon'),
      fsPrev: document.getElementById('fs-prev'),
      fsNext: document.getElementById('fs-next'),
      volume: document.getElementById('volume'),
      queueBox: document.getElementById('queue-box'),
      queueList: document.getElementById('queue-list'),
      queueCount: document.getElementById('queue-count'),
      btnSearchToggle: document.getElementById('btn-search-toggle'),
      searchPanel: document.getElementById('search-panel'),
      searchInput: document.getElementById('search-input'),
      searchClear: document.getElementById('search-clear'),
      searchStatus: document.getElementById('search-status'),
      searchResultsList: document.getElementById('search-results-list')
    };

    // ==========================================
    // Communication WebRTC P2P (Plug & Play universel)
    // ==========================================
    let peer = null;
    let dataChannel = null;
    const rawRoomId = (location.hash ? decodeURIComponent(location.hash.slice(1)) : new URLSearchParams(location.search).get('room') || '').trim();
    const targetRoomId = /^ytm-[a-z0-9-]{4,64}$/.test(rawRoomId) ? rawRoomId : '';

    // Identifiant secret et persistant de cet appareil : le PC s'en sert pour mémoriser
    // les appareils déjà autorisés.
    function getDeviceId() {
      try {
        let id = localStorage.getItem('ytmr_device_id');
        if (!id || !/^[a-f0-9]{32}$/.test(id)) {
          const bytes = crypto.getRandomValues(new Uint8Array(16));
          id = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
          localStorage.setItem('ytmr_device_id', id);
        }
        return id;
      } catch (e) {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      }
    }
    const deviceId = getDeviceId();
    function getDeviceName() {
      const ua = navigator.userAgent || '';
      if (/iPhone/i.test(ua)) return 'iPhone';
      if (/iPad/i.test(ua)) return 'iPad';
      if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? 'Téléphone Android' : 'Tablette Android';
      if (/Mac OS X/i.test(ua)) return 'Mac';
      if (/Windows/i.test(ua)) return 'PC Windows';
      return 'Navigateur';
    }
    // 'pending' | 'approved' | 'denied' | 'revoked'
    let authStatus = 'pending';

    // ==========================================
    // Système de Logs & Diagnostic en temps réel
    // ==========================================
    // Panneau de diagnostic réservé au débogage : ajouter ?debug à l'URL pour l'afficher
    if (new URLSearchParams(location.search).has('debug')) {
      document.getElementById('logs-card').hidden = false;
    }
    const logsListEl = document.getElementById('logs-list');
    const logsBadgeEl = document.getElementById('logs-badge');
    const logsBodyEl = document.getElementById('logs-body');
    const logsArrowEl = document.getElementById('logs-arrow');
    const logsToggleEl = document.getElementById('logs-toggle');
    const btnCopyLogs = document.getElementById('btn-copy-logs');
    const btnClearLogs = document.getElementById('btn-clear-logs');
    let logsCount = 0;
    let isLogsOpen = false;
    const allLogEntries = [];

    function addLog(tag, msg, color = '#aaa') {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const entryText = `[${timeStr}] [${tag}] ${msg}`;
      allLogEntries.push(entryText);
      if (allLogEntries.length > 250) allLogEntries.shift();

      logsCount++;
      if (logsBadgeEl) logsBadgeEl.textContent = logsCount;

      if (logsListEl) {
        if (logsCount === 1) logsListEl.innerHTML = '';
        const row = document.createElement('div');
        row.style.cssText = `color: ${color}; word-break: break-all; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 2px;`;
        // Le message peut contenir des titres ou des données reçues du réseau : jamais d'innerHTML.
        const timeEl = document.createElement('span');
        timeEl.style.opacity = '0.5';
        timeEl.textContent = `[${timeStr}]`;
        const tagEl = document.createElement('strong');
        tagEl.style.color = color;
        tagEl.textContent = `[${tag}]`;
        row.append(timeEl, ' ', tagEl, ' ', String(msg));
        logsListEl.appendChild(row);
        if (isLogsOpen) {
          logsBodyEl.scrollTop = logsBodyEl.scrollHeight;
        }
      }
    }

    if (logsToggleEl) {
      logsToggleEl.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        isLogsOpen = !isLogsOpen;
        logsBodyEl.style.display = isLogsOpen ? 'block' : 'none';
        logsArrowEl.style.transform = isLogsOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        if (isLogsOpen) logsBodyEl.scrollTop = logsBodyEl.scrollHeight;
      });
    }

    if (btnCopyLogs) {
      btnCopyLogs.addEventListener('click', (e) => {
        e.stopPropagation();
        const text = allLogEntries.join('\n');
        navigator.clipboard.writeText(text).then(() => {
          const old = btnCopyLogs.textContent;
          btnCopyLogs.textContent = 'Copié !';
          setTimeout(() => { btnCopyLogs.textContent = old; }, 1500);
        }).catch(() => {
          alert('Impossible de copier automatiquement. Sélectionnez le texte ci-dessous.');
        });
      });
    }

    if (btnClearLogs) {
      btnClearLogs.addEventListener('click', (e) => {
        e.stopPropagation();
        allLogEntries.length = 0;
        logsCount = 0;
        if (logsBadgeEl) logsBadgeEl.textContent = '0';
        if (logsListEl) logsListEl.innerHTML = '<div style="color: #666;">Logs effacés.</div>';
      });
    }

    addLog('INIT', 'Démarrage télécommande. Room cible: ' + (targetRoomId || 'AUCUNE (flashez le QR)'), '#fff');

    // Envoi unique en texte JSON sur le RTCDataChannel natif (voir le commentaire du patch TextDecoder)
    function sendRaw(payload) {
      const dc = dataChannel && dataChannel.dataChannel;
      if (!payload || !dc || dc.readyState !== 'open') return false;
      try {
        dc.send(JSON.stringify(payload));
        return true;
      } catch (e) {
        return false;
      }
    }

    function sendP2PMessage(payload) {
      if (authStatus !== 'approved') return false;
      return sendRaw(payload);
    }

    function sendAction(action, value = null) {
      vibrate();
      if (authStatus !== 'approved') {
        addLog('ERR', 'Action ignorée (' + action + ') : appareil pas encore autorisé par le PC', '#ff3366');
        return;
      }
      const valStr = (value !== null && value !== undefined) ? ' ' + JSON.stringify(value) : '';
      const msgId = 'act-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
      const payload = { action, value, msgId };

      const sent = sendP2PMessage(payload);
      if (sent) {
        addLog('ENVOI', action + valStr, '#00e5ff');
      } else {
        addLog('ERR', 'Échec envoi (' + action + '): Canal non ouvert !', '#ff3366');
      }
    }

    function initWebRTCClient() {
      if (!targetRoomId) {
        el.connDot.className = 'status-dot disconnected';
        el.connText.textContent = 'Lien incomplet : flashez le QR Code';
        addLog('ERR', 'Room ID absent de l\'URL (#ytm-...)', '#ff3366');
        return;
      }

      el.connDot.className = 'status-dot';
      el.connText.textContent = 'Connexion à votre PC…';
      addLog('CONN', 'Initialisation PeerJS client…', '#ffbb00');

      try {
        peer = new Peer({ debug: 1 });

        peer.on('open', (id) => {
          addLog('CONN', 'Peer client prêt (id=' + id + '). Connexion à l\'hôte: ' + targetRoomId, '#00e676');
          connectToPeerHost();
        });

        peer.on('error', (err) => {
          console.warn('Peer error:', err);
          el.connDot.className = 'status-dot disconnected';
          el.connText.textContent = 'Erreur réseau : reconnexion…';
          addLog('ERR', 'Erreur PeerJS: ' + (err?.type || err?.message || err), '#ff3366');
          if (authStatus === 'denied' || authStatus === 'revoked') return;
          if (peer.disconnected && !peer.destroyed) {
            addLog('CONN', 'Reconnexion au serveur de signalisation…', '#ffbb00');
            peer.reconnect();
          } else if (peer.destroyed) {
            initWebRTCClient();
          } else {
            setTimeout(connectToPeerHost, 3000);
          }
        });

        peer.on('disconnected', () => {
          addLog('CONN', 'Peer déconnecté du serveur de signalisation. Reconnexion…', '#ffbb00');
          if (!peer.destroyed) {
            peer.reconnect();
          }
        });
      } catch (e) {
        console.error('PeerJS init failed:', e);
        addLog('ERR', 'Exception PeerJS: ' + e.message, '#ff3366');
      }
    }

    function setAuthStatus(status) {
      authStatus = status;
      if (status === 'approved') {
        // Recharger les paroles du morceau en cours dès l'autorisation
        if (typeof lastLyricsTrackKey !== 'undefined') lastLyricsTrackKey = '';
        el.connDot.className = 'status-dot connected';
        el.connText.textContent = 'Connecté au PC';
        addLog('AUTH', 'Appareil autorisé par le PC', '#00e676');
      } else if (status === 'pending') {
        el.connDot.className = 'status-dot';
        el.connText.textContent = 'Acceptez la connexion sur votre PC…';
        addLog('AUTH', 'En attente d\'autorisation sur le PC', '#ffbb00');
      } else if (status === 'denied') {
        el.connDot.className = 'status-dot disconnected';
        el.connText.textContent = 'Accès refusé par le PC. Rechargez pour réessayer.';
        addLog('AUTH', 'Accès refusé par le PC', '#ff3366');
      } else if (status === 'revoked') {
        el.connDot.className = 'status-dot disconnected';
        el.connText.textContent = 'Déconnecté par le PC. Rechargez pour réessayer.';
        addLog('AUTH', 'Appareil déconnecté par le PC', '#ff3366');
      }
    }

    function connectToPeerHost() {
      if (!peer || peer.destroyed) return;
      if (authStatus === 'denied' || authStatus === 'revoked') return;
      if (peer.disconnected) {
        peer.reconnect();
        return;
      }
      addLog('CONN', 'Tentative de connexion à ' + targetRoomId + '…', '#ffbb00');
      authStatus = 'pending';
      dataChannel = peer.connect(targetRoomId, {
        reliable: true,
        serialization: 'json'
      });

      let lastLoggedTrack = '';
      let lastLoggedPlay = null;

      function handleIncomingData(raw) {
        if (!raw) return;
        let payload = raw;
        if (typeof payload === 'string') {
          try { payload = JSON.parse(payload); } catch (e) {}
        }
        if (typeof payload !== 'object' || !payload) return;

        if (payload.type === 'auth') {
          if (['pending', 'approved', 'denied', 'revoked'].includes(payload.status)) {
            setAuthStatus(payload.status);
          }
          return;
        }
        if (authStatus !== 'approved') return;

        if (payload.type === 'diag-log') {
          addLog('PC', payload.message, '#a8ff00');
        } else if (payload.type === 'state') {
          const s = payload.data || {};
          const trackKey = (s.title || '') + '|' + (s.artist || '');
          if (trackKey !== lastLoggedTrack || s.isPlaying !== lastLoggedPlay) {
            lastLoggedTrack = trackKey;
            lastLoggedPlay = s.isPlaying;
            addLog('REÇU', `State: [${s.isPlaying ? '▶ EN LECTURE' : '⏸ EN PAUSE'}] "${s.title}" (${s.artist})`, '#b388ff');
          }
          applyState(payload.data);
        } else if (payload.type === 'lyrics') {
          applyLyricsResponse(payload);
        } else if (payload.type === 'search-results') {
          addLog('REÇU', `Recherche: ${payload.results?.length || 0} résultats pour "${payload.query}"`, '#00e5ff');
          renderSearchResults(payload.results, payload.query);
        }
      }

      function bindNativeClientChannel(dc) {
        if (!dc || dc._ytmBound) return;
        dc._ytmBound = true;
        try { dc.binaryType = 'arraybuffer'; } catch (e) {}

        dc.addEventListener('message', async (evt) => {
          let data = evt.data;
          if (data instanceof Blob) {
            try { data = await data.text(); } catch (e) {}
          } else if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) {
            try { data = new TextDecoder().decode(data); } catch (e) {}
          }
          handleIncomingData(data);
        });
      }

      // Les messages n'arrivent que par le canal natif : pas de handler dataChannel.on('data'),

    // ==========================================
    // Panneaux tirables (paroles, file d'attente)
    // ==========================================
    // Suivi 1:1 du doigt sur l'en-tête, élan projeté au relâchement (décélération façon iOS),
    // aimantation mi-hauteur / plein écran / fermé, résistance élastique au-delà du haut.
    // Ressort sans dépassement, animé depuis la position affichée : interruptible à tout moment.
    const sheets = (() => {
      const scrim = document.getElementById('sheet-scrim');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const registry = new Map();
      let current = null;
      const snaps = () => ({ full: 48, half: Math.round(window.innerHeight * 0.4), closed: Math.round(window.innerHeight * 1.05) });
      const project = (v, d = 0.998) => (v / 1000) * d / (1 - d);
      const rubber = (over, dim, c = 0.55) => (over * dim * c) / (dim + c * Math.abs(over));

      function paint(entry, y) {
        entry.y = y;
        entry.el.style.transform = 'translateY(' + y + 'px)';
        const s = snaps();
        const open = Math.max(0, Math.min(1, 1 - (y - s.half) / (s.closed - s.half)));
        scrim.style.opacity = String(open);
        scrim.style.pointerEvents = open > 0.05 ? 'auto' : 'none';
      }

      function settle(entry, target, velocity = 0) {
        cancelAnimationFrame(entry.raf);
        const done = () => {
          if (target >= snaps().closed) {
            if (current === entry) current = null;
            if (entry.onClose) entry.onClose();
          }
        };
        if (reduceMotion) { paint(entry, target); done(); return; }
        const response = 0.32;
        const k = (2 * Math.PI / response) ** 2;
        const c = 4 * Math.PI / response; // amortissement critique : aucun dépassement
        let v = velocity;
        let last = performance.now();
        const tick = (t) => {
          const dt = Math.min(0.032, (t - last) / 1000 || 0.016);
          last = t;
          v += (-k * (entry.y - target) - c * v) * dt;
          const y = entry.y + v * dt;
          if (Math.abs(y - target) < 0.5 && Math.abs(v) < 5) { paint(entry, target); done(); return; }
          paint(entry, y);
          entry.raf = requestAnimationFrame(tick);
        };
        entry.raf = requestAnimationFrame(tick);
      }

      function register(name, el, hooks = {}) {
        const entry = { name, el, y: snaps().closed, raf: 0, onOpen: hooks.onOpen, onClose: hooks.onClose };
        registry.set(name, entry);
        paint(entry, entry.y);
        scrim.style.opacity = '0';
        scrim.style.pointerEvents = 'none';
        const head = el.querySelector('.sheet-head');
        let drag = null;
        head.addEventListener('pointerdown', (e) => {
          if (e.target.closest('button')) return; // les boutons de l'en-tête restent des boutons
          try { head.setPointerCapture(e.pointerId); } catch (err) {}
          cancelAnimationFrame(entry.raf);
          drag = { id: e.pointerId, startY: e.clientY, startPos: entry.y, hist: [[e.clientY, e.timeStamp]] };
        });
        head.addEventListener('pointermove', (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          let y = drag.startPos + (e.clientY - drag.startY);
          const top = snaps().full;
          if (y < top) y = top - rubber(top - y, window.innerHeight);
          paint(entry, y);
          drag.hist.push([e.clientY, e.timeStamp]);
          if (drag.hist.length > 6) drag.hist.shift();
        });
        const release = (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const a = drag.hist[0], b = drag.hist[drag.hist.length - 1];
          const v = b[1] > a[1] ? ((b[0] - a[0]) / (b[1] - a[1])) * 1000 : 0;
          const landing = entry.y + project(v);
          const s = snaps();
          const target = [s.full, s.half, s.closed].reduce((best, p) => (Math.abs(p - landing) < Math.abs(best - landing) ? p : best), s.half);
          drag = null;
          settle(entry, target, v);
        };
        head.addEventListener('pointerup', release);
        head.addEventListener('pointercancel', release);
      }

      function open(name, where = 'half') {
        const entry = registry.get(name);
        if (!entry) return;
        if (current && current !== entry) close(true);
        current = entry;
        if (entry.onOpen) entry.onOpen();
        settle(entry, snaps()[where]);
      }

      function close(instant) {
        if (!current) return;
        const entry = current;
        if (instant) {
          cancelAnimationFrame(entry.raf);
          paint(entry, snaps().closed);
          current = null;
          if (entry.onClose) entry.onClose();
        } else {
          settle(entry, snaps().closed);
        }
      }

      scrim.addEventListener('click', () => close());
      return { register, open, close, isOpen: (name) => current === registry.get(name) };
    })();

    // Remplissage des curseurs (piste fine, épaisse sous le doigt)
    function paintRange(input) {
      const min = +input.min || 0;
      const max = input.max === '' ? 100 : +input.max;
      input.style.setProperty('--p', ((+input.value - min) / (max - min)) * 100 + '%');
    }
    for (const r of document.querySelectorAll('input.range')) {
      paintRange(r);
      r.addEventListener('input', () => paintRange(r));
      r.addEventListener('pointerdown', () => r.classList.add('is-active'));
      for (const ev of ['pointerup', 'pointercancel', 'blur']) r.addEventListener(ev, () => r.classList.remove('is-active'));
    }
    // L'état reçu du PC change la valeur sans événement : on repeint régulièrement
    setInterval(() => document.querySelectorAll('input.range').forEach(paintRange), 250);

    // Panneau « À suivre » (la file d'attente et la recherche)

          : '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';

    if (el.btnFs) {
      el.btnFs.addEventListener('click', toggleFullscreenLyrics);

    document.addEventListener('keydown', (e) => {

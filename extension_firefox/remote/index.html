    function toggleFullscreenLyrics() {
      vibrate();
      isFullscreenLyrics = !isFullscreenLyrics;
      el.lyricsBox.classList.toggle('is-fullscreen', isFullscreenLyrics);
      document.body.style.overflow = isFullscreenLyrics ? 'hidden' : '';

      if (el.fsIcon) {
        el.fsIcon.innerHTML = isFullscreenLyrics
          ? '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-14v3h3v2h-5V5h2z"/>'
          : '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
      }

      if (isFullscreenLyrics) {
        requestAnimationFrame(() => {
          if (currentActiveLyricIndex >= 0 && el.lyricsList.children[currentActiveLyricIndex]) {
            const activeEl = el.lyricsList.children[currentActiveLyricIndex];
            const scrollContainer = el.lyricsScroll;
            if (scrollContainer) {
              const scrollRect = scrollContainer.getBoundingClientRect();
              const lineRect = activeEl.getBoundingClientRect();
              const offset = (lineRect.top - scrollRect.top) - (scrollRect.height / 2) + (lineRect.height / 2);
              scrollContainer.scrollBy({ top: offset, behavior: 'instant' });
            }
          }
        });
      }
    }

    if (el.btnFs) {
      el.btnFs.addEventListener('click', toggleFullscreenLyrics);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFullscreenLyrics) {
        toggleFullscreenLyrics();
      }
    });

    // Les paroles sont recherchées par le PC (une seule fois par morceau, avec cache) :
    // on les lui demande et on ignore toute réponse qui ne concerne plus le morceau en cours.
    let pendingLyricsReq = '';
    let lastPcTrackKey = '';
    let lyricsRetries = 0;

    function fetchLyrics(rawTitle) {
      el.lyricsList.innerHTML = '';
      lyricsLines = [];
      currentActiveLyricIndex = -1;
      if (!rawTitle || rawTitle.includes('En attente') || rawTitle.includes('connexion')) {
        el.lyricsStatus.textContent = 'En attente d\'un morceau…';
        el.lyricsStatus.hidden = false;
        return;
      }
      el.lyricsStatus.textContent = 'Chargement des paroles…';
      el.lyricsStatus.hidden = false;
      lyricsRetries = 0;
      requestLyrics();
    }

    function requestLyrics() {
      pendingLyricsReq = 'lyr-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      if (!sendP2PMessage({ action: 'get-lyrics', requestId: pendingLyricsReq })) {
        el.lyricsStatus.textContent = 'Connexion au PC nécessaire pour les paroles.';
      }
    }

    function applyLyricsResponse(payload) {
      if (!payload || payload.requestId !== pendingLyricsReq) return;
      pendingLyricsReq = '';
      // Le PC n'est pas encore passé au morceau affiché ici : on redemande un peu plus tard
      if (lastPcTrackKey && payload.key && payload.key !== lastPcTrackKey && lyricsRetries < 6) {
        lyricsRetries++;
        setTimeout(requestLyrics, 1000);
        return;
      }
      const data = payload.lyrics;
      if (data && data.synced) {
        lyricsLines = parseLrc(data.synced);
      } else if (data && data.plain) {
        lyricsLines = data.plain.split('\n').map(line => ({ time: -1, text: line.trim() }));
      } else {
        lyricsLines = [];
      }
      if (lyricsLines.length === 0) {
        el.lyricsStatus.textContent = 'Aucune parole trouvée pour ce morceau.';
        el.lyricsStatus.hidden = false;
      } else {
        el.lyricsStatus.hidden = true;
        prepareLyricsWords();
        renderLyrics();
      }
    }

    function parseLrc(lrc) {
      const out = [];
      let offsetSec = 0;
      const offsetMatch = lrc.match(/\[offset:\s*([+-]?\d+)\s*\]/i);
      if (offsetMatch) {
        offsetSec = parseInt(offsetMatch[1], 10) / 1000;
      }

      for (const line of lrc.split('\n')) {
        let work = line.trim();
        const stamps = [];
        let m;
        while ((m = work.match(/^\[(\d+):(\d+)(?:[.:](\d+))?\]/))) {
          const mm = parseInt(m[1], 10);
          const ss = parseInt(m[2], 10);
          const ff = m[3] ? parseInt(m[3].padEnd(3, '0').slice(0, 3), 10) / 1000 : 0;
          stamps.push(mm * 60 + ss + ff + offsetSec);
          work = work.slice(m[0].length);
        }
        const text = work.trim();
        for (const t of stamps) out.push({ time: Math.max(0, t), text });
      }
      out.sort((a, b) => a.time - b.time);
      return out;
    }

    // Calcul précis des durées mot par mot pour l'animation BetterLyrics
    function prepareLyricsWords() {
      for (let i = 0; i < lyricsLines.length; i++) {
        const item = lyricsLines[i];
        if (item.time < 0) {
          item.words = [{ text: item.text || '♪', start: -1, end: -1 }];
          continue;
        }

        let nextTime = (i + 1 < lyricsLines.length && lyricsLines[i + 1].time > item.time)
          ? lyricsLines[i + 1].time
          : item.time + 3.8;

        const rawDur = nextTime - item.time;
        const wordsRaw = (item.text || '♪').trim().split(/\s+/).filter(Boolean);
        const wordsList = wordsRaw.length ? wordsRaw : ['♪'];

        let effectiveDur = rawDur <= 5.5
          ? Math.max(0.8, rawDur - 0.12)
          : Math.min(rawDur - 0.4, Math.max(1.8, wordsList.length * 0.45));

        const weights = wordsList.map(w => Math.max(1, w.replace(/[^\p{L}\p{N}]/gu, '').length));
        const totalWeight = weights.reduce((acc, w) => acc + w, 0) || 1;

        let curWordStart = item.time;
        item.words = wordsList.map((word, wIdx) => {
          const wDur = (weights[wIdx] / totalWeight) * effectiveDur;
          const wStart = curWordStart;
          const wEnd = curWordStart + wDur;
          curWordStart = wEnd;
          return { text: word, start: wStart, end: wEnd };
        });
        item.endTime = item.time + effectiveDur;
      }
    }

    function renderLyrics() {
      el.lyricsList.innerHTML = '';
      currentActiveLyricIndex = -1;

      lyricsLines.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.dataset.idx = idx;

        if (Array.isArray(item.words) && item.words.length > 0) {
          item.words.forEach((wObj, wIdx) => {
            const span = document.createElement('span');
            span.className = 'lyric-word future';
            span.dataset.wordIdx = wIdx;
            span.textContent = wObj.text;
            div.appendChild(span);
            if (wIdx < item.words.length - 1) {
              div.appendChild(document.createTextNode(' '));
            }
          });
        } else {
          div.textContent = item.text || '♪';
        }

        if (item.time >= 0) {
          div.addEventListener('click', () => {
            vibrate();
            sendAction('seek-absolute', item.time);
          });
        }
        el.lyricsList.appendChild(div);
      });
    }

    let estimatedCurrentTime = 0;
    let lastStateTime = Date.now();
    let isTrackPlaying = false;

    function updateActiveLyric(currentTime) {
      if (!lyricsLines.length || !lyricsOpen) return;

      // 1. Détection de la ligne active
      let activeIdx = -1;
      for (let i = 0; i < lyricsLines.length; i++) {
        if (lyricsLines[i].time >= 0 && lyricsLines[i].time <= currentTime + 0.15) {
          activeIdx = i;
        } else if (lyricsLines[i].time > currentTime + 0.15) {
          break;
        }
      }

      const all = el.lyricsList.children;

      // 2. Gestion du défilement lors du changement de ligne
      if (activeIdx !== currentActiveLyricIndex) {
        currentActiveLyricIndex = activeIdx;
        for (let i = 0; i < all.length; i++) {
          const isAct = (i === activeIdx);
          const isPast = (activeIdx >= 0 && i < activeIdx);
          all[i].classList.toggle('active', isAct);
          all[i].classList.toggle('past-line', isPast);

          if (!isAct) {
            const spans = all[i].querySelectorAll('.lyric-word');
            for (const sp of spans) {
              sp.className = isPast ? 'lyric-word past' : 'lyric-word future';
              sp.style.removeProperty('--prog');
            }
          }
        }

        if (activeIdx >= 0 && all[activeIdx]) {
          const activeEl = all[activeIdx];
          const scrollContainer = el.lyricsScroll;
          if (scrollContainer) {
            const scrollRect = scrollContainer.getBoundingClientRect();
            const lineRect = activeEl.getBoundingClientRect();
            const offset = (lineRect.top - scrollRect.top) - (scrollRect.height / 2) + (lineRect.height / 2);
            scrollContainer.scrollBy({ top: offset, behavior: 'smooth' });
          }
        }
      }

      // 3. Animation mot par mot au fur et à mesure de la prononciation (Style BetterLyrics)
      if (activeIdx >= 0 && all[activeIdx] && lyricsLines[activeIdx] && lyricsLines[activeIdx].words) {
        const lineItem = lyricsLines[activeIdx];
        const lineEl = all[activeIdx];
        const spans = lineEl.querySelectorAll('.lyric-word');

        for (let wIdx = 0; wIdx < lineItem.words.length; wIdx++) {
          const wObj = lineItem.words[wIdx];
          const span = spans[wIdx];
          if (!span) continue;

          if (currentTime >= wObj.end) {
            if (!span.classList.contains('past') || span.classList.contains('singing')) {
              span.className = 'lyric-word past';
              span.style.removeProperty('--prog');
            }
          } else if (currentTime < wObj.start) {
            if (!span.classList.contains('future')) {
              span.className = 'lyric-word future';
              span.style.removeProperty('--prog');
            }
          } else {
            span.className = 'lyric-word singing';
            const wordDur = Math.max(0.05, wObj.end - wObj.start);
            const p = Math.max(0, Math.min(1, (currentTime - wObj.start) / wordDur));
            span.style.setProperty('--prog', (p * 100).toFixed(1) + '%');
          }
        }
      }
    }

    // Animation 60fps ultra-fluide pour le karaoké mot par mot
    function lyricsAnimLoop() {
      if (isTrackPlaying && !isUserSeeking && lyricsOpen) {
        const now = Date.now();
        const delta = (now - lastStateTime) / 1000;
        const current = estimatedCurrentTime + delta;
        updateActiveLyric(current);
      }
      requestAnimationFrame(lyricsAnimLoop);
    }
    requestAnimationFrame(lyricsAnimLoop);

    el.seek.addEventListener('input', () => { isUserSeeking = true; });
    el.seek.addEventListener('change', () => {
      sendAction('seek', el.seek.value / 10);
      isUserSeeking = false;
    });

    el.volume.addEventListener('input', () => { isUserVolume = true; });
    el.volume.addEventListener('change', () => {
      sendAction('volume', parseInt(el.volume.value, 10));
      isUserVolume = false;
    });

    // ==========================================
    // Volume au geste (pincement caméra, glissement sur la pochette)
    // ==========================================
    // Les gestes produisent un flot de valeurs : on met à jour le curseur tout de suite et on
    // n'envoie au PC qu'une valeur toutes les 120 ms au plus, sans vibration ni journal.
    let gestureVolumeTimer = null;
    let gestureVolumePending = null;
    let gestureReleaseTimer = null;
    let lastSentGestureVolume = -1;

    function setGestureVolume(v) {
      const vol = Math.round(Math.max(0, Math.min(100, v)));
      el.volume.value = vol;
      // L'état reçu du PC ne doit pas faire sauter le curseur pendant le geste
      isUserVolume = true;
      clearTimeout(gestureReleaseTimer);
      gestureReleaseTimer = setTimeout(() => { isUserVolume = false; }, 1500);
      gestureVolumePending = vol;
      if (gestureVolumeTimer) return;
      const flush = () => {
        gestureVolumeTimer = null;
        if (gestureVolumePending === null || gestureVolumePending === lastSentGestureVolume) return;
        lastSentGestureVolume = gestureVolumePending;
        sendP2PMessage({ action: 'volume', value: gestureVolumePending, msgId: 'g-' + Date.now() });
        gestureVolumePending = null;
        gestureVolumeTimer = setTimeout(flush, 120);
      };
      flush();
    }

    // --- Glissement vertical sur la pochette : toute la hauteur = 100 %
    (function setupCoverSwipe() {
      const wrap = document.getElementById('cover-wrap');
      const bar = document.getElementById('cover-volume');
      const fill = document.getElementById('cover-volume-fill');
      let startY = 0;
      let startVol = 0;
      let swiping = false;
      let pointerId = null;
      let hideTimer = null;

      const show = (v) => {
        fill.style.width = v + '%';
        bar.classList.add('visible');
        clearTimeout(hideTimer);
      };

      wrap.addEventListener('pointerdown', (e) => {
        pointerId = e.pointerId;
        startY = e.clientY;
        startVol = parseInt(el.volume.value, 10) || 0;
        swiping = false;
      });
      wrap.addEventListener('pointermove', (e) => {
        if (e.pointerId !== pointerId) return;
        const dy = startY - e.clientY;
        if (!swiping) {
          if (Math.abs(dy) < 10) return; // simple appui : pas un glissement
          swiping = true;
          try { wrap.setPointerCapture(pointerId); } catch (err) {}
          vibrate();
        }
        const v = Math.round(Math.max(0, Math.min(100, startVol + (dy / wrap.clientHeight) * 100)));
        setGestureVolume(v);
        show(v);
      });
      const end = (e) => {
        if (e.pointerId !== pointerId) return;
        pointerId = null;
        if (swiping) hideTimer = setTimeout(() => bar.classList.remove('visible'), 700);
        swiping = false;
      };
      wrap.addEventListener('pointerup', end);
      wrap.addEventListener('pointercancel', end);
    })();

    // --- Curseur à la main (MediaPipe Hand Landmarker, calcul local sur le téléphone)
    // La paume déplace un curseur rond ; pincer (pouce contre index) enfonce, écarter relâche.
    // Pincement bref = clic ; pincer, déplacer, relâcher = glisser (curseurs de volume et de
    // progression, pochette, listes). La position suit le centre de la paume, pas les doigts,
    // pour que le pincement lui-même ne fasse pas bouger le curseur.
    const HAND = {
      MEDIAPIPE: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
      MODEL: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      // Seule la zone centrale de l'image pilote le curseur : de petits gestes autour du
      // centre couvrent tout l'écran, et la main reste là où la détection est la meilleure.
      ZONE_X: [0.3, 0.7],
      ZONE_Y: [0.25, 0.65],
      // Filtre « One Euro » : lisse fort à l'arrêt (curseur calme), peu en mouvement rapide
      FILTER_MIN_CUTOFF: 0.7, // Hz : plus bas = plus stable à l'arrêt
      FILTER_BETA: 0.004,     // plus haut = plus réactif aux gestes rapides
      FILTER_D_CUTOFF: 1.0,
      // Pincement : écart pouce-index / taille de la main (poignet -> base du majeur) dans
      // l'image. Un seuil absolu en centimètres sur la 3D de MediaPipe s'est révélé trop strict
      // à l'usage (la 3D estimée ne descend pas toujours sous 3 cm doigts collés).
      PINCH_ON: 0.30,         // en dessous : pincé
      PINCH_OFF: 0.42,        // au-dessus : relâché (hystérésis)
      // La 3D, rapportée à la taille de la main, sert seulement de garde-fou :
      WORLD_VETO: 0.6,        // doigts nettement écartés en 3D : pas un pincement (main de profil)
      WORLD_ON: 0.32,         // doigts nettement collés en 3D : pincement même si l'image hésite
      PRESS_FRAMES: 2,        // images pincées consécutives avant d'enfoncer
      RELEASE_FRAMES: 2,      // images ouvertes consécutives avant de relâcher (glisser stable)
      CLICK_LOCK_MS: 180,     // le curseur reste figé au début du pincement (clic précis)
      READY_MS: 200,          // main visible depuis au moins ce temps avant de pouvoir pincer
      LOST_MS: 300,           // main absente depuis plus longtemps : curseur masqué, relâché
      MAGNET: 0.45,           // attraction du curseur vers le centre du bouton survolé
      MAGNET_MAX_PX: 90,      // seulement pour les petites cibles (boutons, pas les lignes)
      STICKY_PX: 14,          // le survol tient encore à cette distance hors du bouton
      FRAME_MS: 33            // repli sans requestVideoFrameCallback : ~30 analyses par seconde
    };

    const clamp01 = (v) => Math.max(0, Math.min(1, v));

    // Filtre One Euro (Casiez et al., 2012) pour une coordonnée
    function oneEuro() {
      let x = null, dx = 0, last = 0;
      const alpha = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));
      return {
        reset() { x = null; dx = 0; },
        filter(value, now) {
          if (x === null) { x = value; last = now; return x; }
          const dt = Math.max(1e-3, (now - last) / 1000);
          last = now;
          const rawDx = (value - x) / dt;
          dx += alpha(HAND.FILTER_D_CUTOFF, dt) * (rawDx - dx);
          const cutoff = HAND.FILTER_MIN_CUTOFF + HAND.FILTER_BETA * Math.abs(dx);
          x += alpha(cutoff, dt) * (value - x);
          return x;
        }
      };
    }

    function newAirState() {
      return { visible: false, x: 0, y: 0, pressed: false, pinchFrames: 0, openFrames: 0, pressedAt: 0, anchorX: 0, anchorY: 0, seenSince: 0, lastSeen: 0, fx: oneEuro(), fy: oneEuro(), pinch: null };
    }

    // Mesure du pincement. ratio : écart pouce-index / taille de la main dans l'image (principal).
    // worldRatio : même rapport en 3D (null si indisponible), utilisé en garde-fou dans les deux sens.
    function pinchLevel(landmarks, world) {
      const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const ratio = d(landmarks[4], landmarks[8]) / d(landmarks[0], landmarks[9]);
      let worldRatio = null;
      if (world && world[0] && world[4] && world[8] && world[9]) {
        const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
        const palm = d3(world[0], world[9]);
        if (palm > 0.02) worldRatio = d3(world[4], world[8]) / palm;
      }
      let on = ratio < HAND.PINCH_ON;
      if (on && worldRatio !== null && worldRatio > HAND.WORLD_VETO) on = false;  // main de profil
      if (!on && worldRatio !== null && worldRatio < HAND.WORLD_ON) on = true;     // l'image hésite
      const off = ratio > HAND.PINCH_OFF && !(worldRatio !== null && worldRatio < HAND.WORLD_ON);
      return { on, off, ratio, worldRatio, approach: clamp01((ratio - HAND.PINCH_ON) / (HAND.PINCH_OFF * 1.4 - HAND.PINCH_ON)) };
    }

    // Logique pure (testable) : à partir des points de la main (ou null), met à jour l'état et
    // renvoie les événements à appliquer : move, down, up (cancel si la main est perdue), hide.
    function airStep(state, landmarks, now, vw, vh, world) {
      const events = [];
      const size = landmarks ? Math.hypot(landmarks[0].x - landmarks[9].x, landmarks[0].y - landmarks[9].y) : 0;
      if (!landmarks || size < 0.02) {
        state.seenSince = 0;
        if (state.visible && now - state.lastSeen > HAND.LOST_MS) {
          if (state.pressed) { state.pressed = false; events.push({ type: 'up', x: state.x, y: state.y, cancel: true }); }
          state.visible = false;
          state.fx.reset();
          state.fy.reset();
          events.push({ type: 'hide' });
        }
        return events;
      }
      state.lastSeen = now;
      if (!state.seenSince) state.seenSince = now;

      // Centre de la paume (poignet et bases des doigts), image retournée en miroir
      const pts = [0, 5, 9, 13, 17].map(i => landmarks[i]);
      const px = 1 - pts.reduce((s, p) => s + p.x, 0) / pts.length;
      const py = pts.reduce((s, p) => s + p.y, 0) / pts.length;
      const tx = clamp01((px - HAND.ZONE_X[0]) / (HAND.ZONE_X[1] - HAND.ZONE_X[0])) * vw;
      const ty = clamp01((py - HAND.ZONE_Y[0]) / (HAND.ZONE_Y[1] - HAND.ZONE_Y[0])) * vh;
      const fx = state.fx.filter(tx, now);
      const fy = state.fy.filter(ty, now);

      const pinch = pinchLevel(landmarks, world);
      state.pinch = pinch;
      if (!state.visible) {
        state.visible = true;
        state.x = fx;
        state.y = fy;
      } else if (state.pressed) {
        state.x = fx;
        state.y = fy;
      } else {
        // Doigts qui se rapprochent : le curseur ralentit pour que le clic tombe là où on visait
        const k = 0.15 + 0.85 * pinch.approach;
        state.x += (fx - state.x) * k;
        state.y += (fy - state.y) * k;
      }

      // Pincement avec hystérésis et confirmation sur plusieurs images
      const ready = now - state.seenSince >= HAND.READY_MS;
      if (!state.pressed) {
        state.pinchFrames = pinch.on ? state.pinchFrames + 1 : 0;
        if (ready && state.pinchFrames >= HAND.PRESS_FRAMES) {
          state.pressed = true;
          state.openFrames = 0;
          state.pressedAt = now;
          state.anchorX = state.x;
          state.anchorY = state.y;
          events.push({ type: 'down', x: state.x, y: state.y });
        }
      } else {
        state.openFrames = pinch.off ? state.openFrames + 1 : 0;
        if (state.openFrames >= HAND.RELEASE_FRAMES) {
          state.pressed = false;
          state.pinchFrames = 0;
          events.push({ type: 'up', x: state.x, y: state.y, cancel: false });
        }
      }
      // Début de pincement : curseur figé pour que le clic tombe là où on visait
      if (state.pressed && now - state.pressedAt < HAND.CLICK_LOCK_MS) {
        state.x = state.anchorX;
        state.y = state.anchorY;
      }
      events.unshift({ type: 'move', x: state.x, y: state.y });
      return events;
    }

    // --- Application des événements sur la page
    const airCursorEl = document.createElement('div');
    airCursorEl.className = 'air-cursor';
    airCursorEl.hidden = true;
    document.body.appendChild(airCursorEl);

    const AIR_TARGETS = 'button, input[type="range"], .queue-item, .search-item, .lyric-line, #cover-wrap, a, input[type="text"], select';
    const AIR_MAGNETIC = 'button, a, select';
    const air = { hover: null, mode: null, target: null, startX: 0, startY: 0, lastY: 0, shownX: 0, shownY: 0 };

    function airTargetAt(x, y) {
      const hit = document.elementFromPoint(x, y);
      return hit ? hit.closest(AIR_TARGETS) : null;
    }

    function insideRect(el, x, y, margin) {
      const r = el.getBoundingClientRect();
      return x >= r.left - margin && x <= r.right + margin && y >= r.top - margin && y <= r.bottom + margin;
    }

    function scrollableAncestor(node) {
      for (let n = node; n && n !== document.body; n = n.parentElement) {
        const cs = getComputedStyle(n);
        if (/(auto|scroll)/.test(cs.overflowY) && n.scrollHeight > n.clientHeight + 2) return n;
      }
      return document.scrollingElement;
    }

    function setRangeFromX(input, x) {
      const r = input.getBoundingClientRect();
      const min = +input.min || 0;
      const max = input.max === '' ? 100 : +input.max;
      input.value = Math.round(min + clamp01((x - r.left) / r.width) * (max - min));
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function airPointer(type, target, x, y) {
      target.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 77, pointerType: 'touch', isPrimary: true, clientX: x, clientY: y }));
    }

    function showCursor(x, y) {
      air.shownX = x;
      air.shownY = y;
      airCursorEl.hidden = false;
      airCursorEl.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    }

    function setHover(t) {
      if (t === air.hover) return;
      if (air.hover) air.hover.classList.remove('air-hover');
      if (t) t.classList.add('air-hover');
      air.hover = t;
    }

    function airApply(ev) {
      if (ev.type === 'hide') {
        airCursorEl.hidden = true;
        setHover(null);
        return;
      }
      if (ev.type === 'move') {
        if (!air.mode) {
          // Survol « collant » : on garde la cible tant que le curseur reste près d'elle
          let t = air.hover && insideRect(air.hover, ev.x, ev.y, HAND.STICKY_PX) ? air.hover : airTargetAt(ev.x, ev.y);
          setHover(t);
          // Aimant : le curseur affiché est attiré vers le centre des petits boutons
          let sx = ev.x, sy = ev.y;
          if (t && t.matches(AIR_MAGNETIC)) {
            const r = t.getBoundingClientRect();
            if (r.width <= HAND.MAGNET_MAX_PX && r.height <= HAND.MAGNET_MAX_PX) {
              sx += (r.left + r.width / 2 - sx) * HAND.MAGNET;
              sy += (r.top + r.height / 2 - sy) * HAND.MAGNET;
            }
          }
          showCursor(sx, sy);
          return;
        }
        showCursor(ev.x, ev.y);
        if (air.mode === 'range') setRangeFromX(air.target, ev.x);
        else if (air.mode === 'cover') airPointer('pointermove', air.target, ev.x, ev.y);
        else if (air.mode === 'scroll') { air.target.scrollTop -= ev.y - air.lastY; air.lastY = ev.y; }
        else if (air.mode === 'press' && Math.abs(ev.y - air.startY) > 30) {
          // Un appui qui glisse verticalement devient un défilement (listes, page)
          air.target.classList.remove('air-pressed');
          air.mode = 'scroll';
          air.target = scrollableAncestor(air.target);
          air.lastY = ev.y;
        }
        return;
      }
      if (ev.type === 'down') {
        airCursorEl.classList.add('pressed');
        // La cible survolée (aimant, survol collant) prime sur le point exact
        const t = air.hover || airTargetAt(ev.x, ev.y);
        air.startX = ev.x;
        air.startY = air.lastY = ev.y;
        setHover(null);
        if (t && t.matches('input[type="range"]')) {
          air.mode = 'range';
          air.target = t;
          setRangeFromX(t, ev.x);
        } else if (t && t.id === 'cover-wrap') {
          air.mode = 'cover';
          air.target = t;
          airPointer('pointerdown', t, ev.x, ev.y);
        } else if (t) {
          air.mode = 'press';
          air.target = t;
          t.classList.add('air-pressed');
        } else {
          air.mode = 'scroll';
          air.target = scrollableAncestor(document.elementFromPoint(ev.x, ev.y));
        }
        return;
      }
      if (ev.type === 'up') {
        airCursorEl.classList.remove('pressed');
        const { mode, target } = air;
        air.mode = null;
        air.target = null;
        if (mode === 'range') {
          target.dispatchEvent(new Event('change', { bubbles: true }));
        } else if (mode === 'cover') {
          airPointer('pointerup', target, ev.x, ev.y);
        } else if (mode === 'press') {
          target.classList.remove('air-pressed');
          // Tolérance au relâchement : un léger déplacement pendant le pincement ne l'annule pas
          if (!ev.cancel && insideRect(target, ev.x, ev.y, 20)) {
            if (target.matches('input[type="text"]')) target.focus();
            else target.click();
            vibrate();
          }
        }
      }
    }

    const hand = { active: false, stream: null, video: null, landmarker: null, timer: null, wakeLock: null, debugCanvas: null, state: newAirState() };
    const handBtn = document.getElementById('hand-btn');
    const HAND_DEBUG = new URLSearchParams(location.search).has('debug');

    function setHandUi(mode, detail) {
      handBtn.className = 'btn-hand' + (mode ? ' ' + mode : '');
      const titles = {
        loading: 'Curseur à la main : démarrage de la caméra…',
        tracking: 'Curseur à la main : main détectée (pincez pour cliquer)',
        idle: 'Curseur à la main : montrez la main au centre de la caméra',
        error: 'Curseur à la main indisponible' + (detail ? ' : ' + detail : '')
      };
      handBtn.title = titles[mode] || 'Curseur à la main (caméra) : paume pour viser, pincement pour cliquer';
    }

    async function loadHandLandmarker() {
      const vision = await import(HAND.MEDIAPIPE + '/vision_bundle.mjs');
      const fileset = await vision.FilesetResolver.forVisionTasks(HAND.MEDIAPIPE + '/wasm');
      const create = (delegate) => vision.HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: HAND.MODEL, delegate },
        runningMode: 'VIDEO',
        numHands: 1,
        // Suivi image après image plus tolérant que la première détection : la main ne
        // « décroche » pas au moindre flou de mouvement, sans accepter de fausses mains
        minHandDetectionConfidence: 0.6,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.4
      });
      try {
        return await create('GPU');
      } catch (e) {
        return await create('CPU'); // certains téléphones n'ont pas de WebGL utilisable
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !hand.wakeLock) {
          hand.wakeLock = await navigator.wakeLock.request('screen');
          hand.wakeLock.addEventListener('release', () => { hand.wakeLock = null; });
        }
      } catch (e) {}
    }

    function drawHandDebug(landmarks) {
      const c = hand.debugCanvas;
      if (!c || !hand.video) return;
      const ctx = c.getContext('2d');
      ctx.drawImage(hand.video, 0, 0, c.width, c.height);
      // Zone centrale qui pilote le curseur (image non retournée : on retourne les X)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.strokeRect((1 - HAND.ZONE_X[1]) * c.width, HAND.ZONE_Y[0] * c.height, (HAND.ZONE_X[1] - HAND.ZONE_X[0]) * c.width, (HAND.ZONE_Y[1] - HAND.ZONE_Y[0]) * c.height);
      if (!landmarks) return;
      ctx.fillStyle = hand.state.pressed ? '#00e676' : '#ff0055';
      for (const i of [0, 4, 5, 8, 9, 13, 17]) {
        ctx.beginPath();
        ctx.arc(landmarks[i].x * c.width, landmarks[i].y * c.height, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(landmarks[4].x * c.width, landmarks[4].y * c.height);
      ctx.lineTo(landmarks[8].x * c.width, landmarks[8].y * c.height);
      ctx.stroke();
      // Mesures (texte remis à l'endroit : le canvas est affiché en miroir)
      const p = hand.state.pinch;
      if (p) {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(-c.width, 0, c.width, 30);
        ctx.fillStyle = '#fff';
        ctx.font = '11px monospace';
        ctx.fillText('2D ' + p.ratio.toFixed(2) + ' (pincé < ' + HAND.PINCH_ON + ')', -c.width + 4, 12);
        ctx.fillText('3D ' + (p.worldRatio === null ? '—' : p.worldRatio.toFixed(2)) + (hand.state.pressed ? '  APPUI' : ''), -c.width + 4, 25);
        ctx.restore();
      }
    }

    // Traite une image : points de la main (ou null) -> curseur, clics, glisser
    function airFeed(landmarks, now, world) {
      const wasVisible = hand.state.visible;
      const events = airStep(hand.state, landmarks, now, window.innerWidth, window.innerHeight, world);
      events.forEach(airApply);
      if (hand.state.visible !== wasVisible) setHandUi(hand.state.visible ? 'tracking' : 'idle');
    }

    let lastVideoTime = -1;
    function handTick() {
      if (!hand.active) return;
      const now = performance.now();
      // Une analyse par nouvelle image de la caméra (pas de travail en double sur la même image)
      if (hand.video.readyState >= 2 && hand.video.currentTime !== lastVideoTime) {
        lastVideoTime = hand.video.currentTime;
        let landmarks = null;
        let world = null;
        try {
          const res = hand.landmarker.detectForVideo(hand.video, now);
          landmarks = res.landmarks && res.landmarks[0] ? res.landmarks[0] : null;
          world = res.worldLandmarks && res.worldLandmarks[0] ? res.worldLandmarks[0] : null;
        } catch (e) {}
        airFeed(landmarks, now, world);
        if (HAND_DEBUG) drawHandDebug(landmarks);
      }
      if (hand.video.requestVideoFrameCallback) hand.video.requestVideoFrameCallback(handTick);
      else hand.timer = setTimeout(handTick, HAND.FRAME_MS);
    }

    async function startHandCursor() {
      hand.active = true;
      setHandUi('loading');
      try {
        hand.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
          audio: false
        });
        if (!hand.landmarker) hand.landmarker = await loadHandLandmarker();
        if (!hand.active) { stopHandCursor(); return; } // désactivé pendant le chargement
        hand.video = document.createElement('video');
        hand.video.muted = true;
        hand.video.playsInline = true;
        hand.video.srcObject = hand.stream;
        await hand.video.play();
        if (HAND_DEBUG) {
          hand.debugCanvas = document.createElement('canvas');
          hand.debugCanvas.className = 'hand-debug';
          hand.debugCanvas.width = 200;
          hand.debugCanvas.height = 150;
          document.body.appendChild(hand.debugCanvas);
        }
        hand.state = newAirState();
        lastVideoTime = -1;
        setHandUi('idle');
        requestWakeLock();
        addLog('MAIN', 'Curseur à la main actif', '#00e676');
        handTick();
      } catch (e) {
        const msg = e && e.name === 'NotAllowedError' ? 'caméra refusée' : (e && e.message ? e.message : 'erreur');
        addLog('ERR', 'Curseur à la main : ' + msg, '#ff3366');
        stopHandCursor();
        setHandUi('error', msg);
      }
    }

    function stopHandCursor() {
      hand.active = false;
      clearTimeout(hand.timer);
      // Un glisser en cours est relâché, le curseur disparaît
      airFeed(null, Infinity);
      if (hand.stream) hand.stream.getTracks().forEach(t => t.stop());
      hand.stream = null;
      if (hand.video) hand.video.srcObject = null;
      hand.video = null;
      if (hand.debugCanvas) hand.debugCanvas.remove();
      hand.debugCanvas = null;
      if (hand.wakeLock) hand.wakeLock.release().catch(() => {});
      hand.wakeLock = null;
      setHandUi('');
    }

    handBtn.addEventListener('click', () => {
      vibrate();
      if (hand.active) stopHandCursor();
      else startHandCursor();
    });

    // Le verrou d'écran saute quand la page passe en arrière-plan : on le reprend au retour
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && hand.active) requestWakeLock();
    });

    // Accès pour les tests automatisés : logique pure + injection de mains simulées
    window.__airCursor = { step: airStep, newState: newAirState, HAND, feed: airFeed, state: () => hand.state, shown: () => ({ x: air.shownX, y: air.shownY }) };

    let lastArt = '';
    let lastQueueHash = '';
    let currentQueue = [];

    function renderQueue(queue) {
      currentQueue = Array.isArray(queue) ? [...queue] : [];
      if (!Array.isArray(queue) || queue.length === 0) {
        el.queueCount.textContent = '0';
        el.queueList.innerHTML = '<div style="font-size: 12px; color: var(--text-dim); text-align: center; padding: 12px;">Aucun morceau en attente</div>';
        return;
      }

      el.queueCount.textContent = queue.length;
      el.queueList.innerHTML = '';

      queue.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'queue-item' + (item.isCurrent ? ' current' : '');

        const thumbUrl = item.thumbnail || (item.videoId ? `https://i.ytimg.com/vi/${item.videoId}/mqdefault.jpg` : '');
        if (thumbUrl) {
          const img = document.createElement('img');
          img.className = 'queue-thumb';
          img.src = thumbUrl;
          img.loading = 'lazy';
          img.onerror = () => {
            if (item.videoId && !img.src.includes('ytimg.com')) {
              img.src = `https://i.ytimg.com/vi/${item.videoId}/mqdefault.jpg`;
            } else {
              img.outerHTML = '<div class="queue-thumb" style="display:flex;align-items:center;justify-content:center;background:rgb(var(--fg-rgb) / 0.06);"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" opacity="0.35"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>';
            }
          };
          row.appendChild(img);
        } else {
          const noImg = document.createElement('div');
          noImg.className = 'queue-thumb';
          noImg.style.cssText = 'display:flex;align-items:center;justify-content:center;background:rgb(var(--fg-rgb) / 0.06);';
          noImg.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" opacity="0.35"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>';
          row.appendChild(noImg);
        }

        const info = document.createElement('div');
        info.className = 'queue-info';

        const t = document.createElement('div');
        t.className = 'queue-title';
        t.textContent = item.title;
        info.appendChild(t);

        if (item.artist) {
          const a = document.createElement('div');
          a.className = 'queue-artist';
          a.textContent = item.artist;
          info.appendChild(a);
        }
        row.appendChild(info);

        if (item.duration) {
          const d = document.createElement('div');
          d.className = 'queue-duration';
          d.textContent = item.duration;
          row.appendChild(d);
        }

        row.addEventListener('click', () => {
          vibrate();
          const trackData = {
            index: item.index,
            videoId: item.videoId,
            title: item.title,
            artist: item.artist,
            duration: item.duration,
            thumbnail: thumbUrl
          };
          applyState({
            title: item.title,
            artist: item.artist,
            albumArt: thumbUrl,
            isPlaying: true
          });
          sendAction('play-queue-index', trackData);
        });

        el.queueList.appendChild(row);
      });
    }

    function applyState(s) {
      if (!s) return;
      if (s.title) el.title.textContent = s.title;
      if (s.artist) el.artist.textContent = s.artist;
      if (s.duration) lastTrackDuration = s.duration;

      const art = safeHttpsUrl(s.albumArt);
      if (art && art !== lastArt) {
        lastArt = art;
        el.cover.src = art;
        el.bg.style.backgroundImage = 'url("' + art + '")';
        el.coverWrap.style.setProperty('--art', 'url("' + art + '")');
      }
      el.playIcon.innerHTML = s.isPlaying ? PAUSE_SVG : PLAY_SVG;
      if (el.fsPlayIcon) el.fsPlayIcon.innerHTML = s.isPlaying ? PAUSE_SVG : PLAY_SVG;
      el.durTime.textContent = formatTime(s.duration);
      if (!isUserSeeking) {
        el.curTime.textContent = formatTime(s.currentTime);
        if (s.duration > 0) el.seek.value = (s.currentTime / s.duration) * 1000;
      }
      if (!isUserVolume && typeof s.volume === 'number') {
        el.volume.value = s.volume;
      }
      el.like.classList.toggle('active', !!s.liked);
      el.dislike.classList.toggle('active', !!s.disliked);
      el.shuffle.classList.toggle('active', !!s.shuffled);

      if (typeof s.repeatMode === 'number') {
        renderRepeatBtn(s.repeatMode);
      }

      // Paroles : clé = identifiant de la vidéo quand le PC le fournit (l'affichage
      // anticipé d'un titre lancé depuis le mobile n'en a pas encore)
      if (s.videoId) lastPcTrackKey = s.videoId;
      const trackKey = s.videoId || ((s.title || '') + '|' + (s.artist || ''));
      if (trackKey !== lastLyricsTrackKey) {
        lastLyricsTrackKey = trackKey;
        if (lyricsOpen) {
          fetchLyrics(s.title, s.artist, s.duration);
        } else {
          lyricsLines = [];
        }
      }

      // Mise à jour de l'horloge locale
      if (typeof s.currentTime === 'number') {
        estimatedCurrentTime = s.currentTime;
        lastStateTime = Date.now();
        isTrackPlaying = !!s.isPlaying;
        updateActiveLyric(s.currentTime);
      }

      // File d'attente
      if (s.queue) {
        const h = JSON.stringify(s.queue);
        if (h !== lastQueueHash) {
          lastQueueHash = h;
          renderQueue(s.queue);
        }
      }
    }
  </script>
</body>

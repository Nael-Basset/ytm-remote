<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube Music Player</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="player">
    <div class="bg-base"></div>
    <div class="bg-accent" id="bg-accent"></div>
    <div class="bg-art" id="bg-art"></div>
    <div class="bg-fade"></div>

    <header class="header">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 14V8l6 4-6 4z"/>
        </svg>
        <span data-i18n="miniPlayer">Mini Player</span>
      </div>
      <div class="header-actions">
        <button id="qr-button" class="icon-btn" title="Télécommande smartphone (QR Code)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
          </svg>
        </button>
        <button id="pip-button" class="icon-btn" data-i18n-title="pictureInPicture" title="Picture-in-Picture (Always on Top)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/>
          </svg>
        </button>
        <button id="floating-button" class="icon-btn" data-i18n-title="openInWindow" title="Open in window">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
        </button>
        <button id="options-button" class="icon-btn" data-i18n-title="optionsTitle" title="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.94a7.5 7.5 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.36 7.36 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.67 8.84a.5.5 0 00.12.64l2.03 1.58a7.5 7.5 0 000 1.88L2.79 14.52a.5.5 0 00-.12.64l1.92 3.32c.14.24.43.34.6.22l2.39-.96c.49.39 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.17.12.46.02.6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content">
      <div class="thumbnail" id="thumbnail-wrap">
        <img id="album-art" src="icons/icon128.png" alt="">
      </div>
      <div class="track">
        <div id="track-title" class="track-title" data-i18n="trackTitlePlaceholder">Track Title</div>
        <div id="track-artist" class="track-artist" data-i18n="trackArtistPlaceholder">Artist</div>
        <div class="time-row">
          <span id="current-time">0:00</span>
          <span class="time-sep">/</span>
          <span id="total-time">0:00</span>
        </div>
        <div class="extra-actions">
          <button id="dislike-button" class="player-btn" data-i18n-title="dislike" title="Dislike">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zM21 3v12h-4V3h4z"/>
            </svg>
          </button>
          <button id="like-button" class="player-btn" data-i18n-title="like" title="Like">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M9 21h10c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2zM1 9h4v12H1V9z"/>
            </svg>
          </button>
          <button id="shuffle-button" class="player-btn" data-i18n-title="shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
            </svg>
          </button>
          <button id="repeat-button" class="player-btn" data-i18n-title="repeat" title="Repeat">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <div class="progress" id="progress">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" data-i18n-aria="seekLabel" aria-label="Seek">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <footer class="transport">
      <button id="prev-track" class="player-btn" data-i18n-title="previous" title="Previous">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/>
        </svg>
      </button>
      <button id="rewind-button" class="player-btn" data-i18n-title="rewind10" title="Back 10s">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          <text x="12" y="16" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor">10</text>
        </svg>
      </button>
      <button id="play-pause" class="player-btn-hero" data-i18n-title="playPause" title="Play/Pause">
        <svg id="play-pause-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <button id="forward-button" class="player-btn" data-i18n-title="forward10" title="Forward 10s">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
          <text x="12" y="16" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor">10</text>
        </svg>
      </button>
      <button id="next-track" class="player-btn" data-i18n-title="next" title="Next">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/>
        </svg>
      </button>
    </footer>

    <div class="secondary">
      <div class="volume-wrap">
        <button id="mute-button" class="icon-btn" data-i18n-title="mute" title="Mute">
          <svg id="volume-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.05A4.5 4.5 0 0016.5 12zM14 3.23v2.06a7 7 0 010 13.42v2.06A9 9 0 0014 3.23z"/>
          </svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="100" data-i18n-aria="volumeLabel" aria-label="Volume">
      </div>
      <div class="speed-wrap">
        <select id="speed-select" data-i18n-aria="playbackSpeed" data-i18n-title="playbackSpeed" aria-label="Playback speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="1.75">1.75×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <div class="timer-wrap">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.96 8.96 0 0012 4a9 9 0 109 9c0-2.12-.74-4.07-1.97-5.61zM12 20a7 7 0 110-14 7 7 0 010 14z"/>
        </svg>
        <select id="timer-select" data-i18n-aria="sleepTimerTitle" aria-label="Sleep timer">
          <option value="none" data-i18n="none">None</option>
          <option value="15" data-i18n="15Minutes">15 Minutes</option>
          <option value="30" data-i18n="30Minutes">30 Minutes</option>
          <option value="45" data-i18n="45Minutes">45 Minutes</option>
          <option value="60" data-i18n="60Minutes">60 Minutes</option>
        </select>
        <span id="timer-countdown" class="timer-countdown" hidden></span>
      </div>
    </div>

    <div class="lyrics-section" id="lyrics-section">
      <button class="lyrics-toggle" id="lyrics-toggle">
        <span data-i18n="lyrics">Lyrics</span>
        <svg id="lyrics-chevron" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </button>
      <div class="lyrics-body" id="lyrics-body" hidden>
        <div id="lyrics-content"></div>
        <div id="lyrics-empty" class="lyrics-empty" data-i18n="lyricsNotFound" hidden>No lyrics found.</div>
        <div id="lyrics-loading" class="lyrics-empty" data-i18n="lyricsLoading" hidden>Loading…</div>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
